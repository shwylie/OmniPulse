[workspace]
resolver = "2"
# (each crate there is: some are kept out of the public repository, and are only where they're worked on)
members = ["src-tauri", "crates/*"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# (unwind: a panic in a background thread or task, as in a library's, ends that, not the whole app)
panic = "unwind"
strip = true

# Dev builds: no debug info for dependencies, and line numbers only for our own crates (full debug
# info grew target/debug past 50 GB)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# librespot-core with one change: a free account isn't exit(1) (which closed the whole app); see
# vendor/librespot-core/src/session.rs check_catalogue, and VENDORED.md
[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }

# Quick builds, for trying changes (the screenshot self-tests): optimised, but without the slow whole-program
# steps, and kept between builds. `cargo build --profile quick -p omnipulse` (target/quick/). Releases use release.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
opt-level = 1
strip = false
