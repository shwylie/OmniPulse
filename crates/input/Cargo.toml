[package]
name = "omnipulse-input"
version = "0.1.0"
edition = "2021"
description = "OmniPulse Input: plays the app's sound a second time as its own program, for Wave Link and the like"

[[bin]]
name = "omnipulse-input"
path = "src/main.rs"

[dependencies]
cpal = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio"] }

[build-dependencies]
tauri-winres = "0.3"
