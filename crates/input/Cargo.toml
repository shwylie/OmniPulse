[package]
name = "omnipulse-offset"
version = "0.1.0"
edition = "2021"
description = "OmniPulse Offset: plays the app's sound a second time as its own program, for Wave Link and the like"

[[bin]]
name = "omnipulse-offset"
path = "src/main.rs"

[dependencies]
omnipulse-pcmout = { path = "../pcmout" }

[build-dependencies]
tauri-winres = "0.3"
