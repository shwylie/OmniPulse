[package]
name = "offset-omnipulse"
version = "0.1.0"
edition = "2021"
description = "Offset OmniPulse: plays the app's sound a second time as its own program, for Wave Link and the like"

[[bin]]
name = "offset-omnipulse"
path = "src/main.rs"

[dependencies]
omnipulse-pcmout = { path = "../pcmout" }

[build-dependencies]
tauri-winres = "0.3"
