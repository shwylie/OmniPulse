[package]
# OmniPulse's web installer: the one file people download, the same for every version (so Windows' SmartScreen
# comes to know it). It fetches the latest installer, checks it's OmniPulse's, and runs it. Its version stays
# put: a new one only if what it does has to change (then it's submitted to Microsoft once more).
name = "omnipulse-setup"
version = "1.0.0"
edition = "2021"
publish = false

[[bin]]
name = "OmniPulse-Setup"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
minisign-verify = "0.2"
base64 = "0.22"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }

[build-dependencies]
embed-resource = "3.0.12"
