<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniPulse Activity</title>
<style>
  /* OmniPulse's activity feed, for OBS (Docks > Custom Browser Docks): what happened on stream, each kind
     shown or hidden, each alert replayed, the chatbot's events' actions run again */
  :root {
    --bg: #1b1d24; --panel: #23262f; --line: #2e323d; --text: #e6e8ee; --dim: #8b91a1; --accent: #7aa2ff; --danger: #ff5c6c; --fs: 13px;
  }
  * { box-sizing: border-box; }
  /* the scroll bars in the dock's colours, as the app's: OBS's browser draws its own light grey ones otherwise */
  * { scrollbar-width: thin; scrollbar-color: var(--dim) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 4px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: var(--fs) / 1.4 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  header { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
  header h1 { margin: 0 auto 0 2px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  .icon { border: 0; background: transparent; color: var(--dim); padding: 2px 5px; border-radius: 6px; font-size: 14px; line-height: 1; }
  .icon:hover, .icon[aria-pressed="true"] { color: var(--text); background: var(--line); }
  .count { font-size: 11px; color: var(--dim); }

  #settings { display: none; flex: none; max-height: 60%; overflow-y: auto; padding: 8px 10px 10px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12px; }
  #settings.open { display: block; }
  #settings h2 { margin: 8px 0 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
  #settings h2:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 10px; }
  .grid label, .row label { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  .row { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  .links { display: flex; gap: 8px; margin: 4px 0 2px; }
  .link { border: 0; background: none; padding: 0; color: var(--accent); font-size: 11px; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 1px 10px; font-size: 11px; color: var(--dim); }
  .chip:hover { color: var(--text); }
  .chip.danger:hover, .chip.sure { color: #fff; background: var(--danger); border-color: var(--danger); }
  select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }

  #feed { flex: 1; overflow-y: auto; padding: 4px 0 8px; overscroll-behavior: contain; }
  .item { display: grid; grid-template-columns: 26px 1fr auto; gap: 0 8px; align-items: start; padding: 6px 8px 6px 6px; border-left: 3px solid var(--c, var(--line)); margin: 0 0 1px; }
  .item:hover { background: #ffffff08; }
  body.compact .item { padding-top: 2px; padding-bottom: 2px; }
  body.compact .item .msg { display: none; }
  .glyph { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: color-mix(in srgb, var(--c, #888) 22%, transparent); font-size: 14px; }
  body.compact .glyph { width: 20px; height: 20px; font-size: 11px; border-radius: 5px; }
  .what { min-width: 0; }
  .what b { font-weight: 700; }
  .msg { color: var(--dim); font-size: 0.92em; margin-top: 1px; overflow-wrap: anywhere; }
  .meta { color: var(--dim); font-size: 0.8em; margin-top: 1px; }
  body.compact .meta { display: inline; margin-left: 6px; }
  .acts { display: flex; gap: 3px; opacity: 0.45; }
  .item:hover .acts, .acts:focus-within { opacity: 1; }
  /* icon buttons (their tips are the dock's one #tip) */
  .ib { position: relative; display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 4px; color: var(--dim); line-height: 1; cursor: pointer; }
  .ib svg { width: 14px; height: 14px; fill: currentColor; }
  .ib .w { font-size: 9.5px; font-weight: 700; }
  .ib:hover { color: var(--text); border-color: var(--dim); }
  .acts .ib.done { color: #111; background: var(--accent); border-color: var(--accent); }
  .icon { position: relative; }
  .pf { display: inline-block; font-size: 0.7em; font-weight: 700; border-radius: 3px; padding: 0 3px; margin-right: 4px; vertical-align: 1px; color: #111; }
  .pf.twitch { background: #a970ff; } .pf.kick { background: #53fc18; } .pf.other { background: #8b91a1; }
  #empty { color: var(--dim); text-align: center; padding: 24px 16px; font-size: 12px; }
  #toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  #toast.on { opacity: 1; }
  /* the look (Settings > Streaming > Suite, the dock's gear): the app theme's colours, font and corners, or Classic */
  body.sq *, body.sq *::after { border-radius: 0 !important; }
  body.d-compact .item { padding-top: 3px; padding-bottom: 3px; }
  body.d-roomy .item { padding-top: 10px; padding-bottom: 10px; }
  /* the tip on hover: one for the whole dock, placed by its script so it always stays inside the dock */
  #tip { position: fixed; left: 0; top: 0; display: none; max-width: calc(100vw - 8px); box-sizing: border-box; background: #000c; color: #fff; font-size: 11px; font-weight: 400; line-height: 1.35; padding: 4px 8px; border-radius: 6px; pointer-events: none; z-index: 1000; overflow-wrap: anywhere; }
  #tip.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>Activity</h1>
  <span class="count" id="count"></span>
  <button class="icon" id="pause" data-tip="Pause the feed" aria-label="Pause" aria-pressed="false">&#10074;&#10074;</button>
  <button class="icon" id="gear" data-tip="Which events show, and how they look" aria-label="Settings">&#9881;</button>
</header>
<div id="settings">
  <h2>Show</h2>
  <div class="links"><button class="link" id="allOn" type="button">All</button><button class="link" id="allOff" type="button">None</button><button class="link" id="money" type="button">Only follows, subs and money</button></div>
  <div id="kinds"></div>
  <h2>Look</h2>
  <div class="row">
    <label><input type="checkbox" id="oNewest" checked> Newest at the top</label>
    <label><input type="checkbox" id="oCompact"> Compact</label>
    <label><input type="checkbox" id="oPlatform" checked> Platform</label>
    <label><input type="checkbox" id="oMsg" checked> Their message</label>
    <label><input type="checkbox" id="oCmds"> Chat commands</label>
    <label>Text <select id="oSize"><option value="12">Small</option><option value="13" selected>Normal</option><option value="15">Large</option></select></label>
    <label>Platforms <select id="oFrom"><option value="all">All</option><option value="twitch">Twitch</option><option value="kick">Kick</option></select></label>
  </div>
  <h2>The Feed</h2>
  <div class="row"><button class="chip danger" id="clear" type="button">Clear the Feed</button><span class="count">Kept by OmniPulse: the last 250, after a restart too.</span></div>
</div>
<div id="feed"><div id="empty">Follows, subs, bits, raids, rewards and the rest show here, from OmniPulse's chatbot and from any bot sending OmniPulse alerts.</div></div>
<div id="toast"></div>
<script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  // Every kind of event: its name in the settings, glyph, colour, group, and its line
  const amt = (e) => String((e.alert && e.alert.amount) || e.amount || "").trim();
  const n = (e) => parseFloat(String(e.amount || "").replace(/[^\d.]/g, "")) || 0;
  // (where a tip came from, and YouTube's own words for its members and Super Chats)
  const SERVICE = { kofi: "Ko-fi", throne: "Throne", fourthwall: "Fourthwall", streamlabs: "Streamlabs", streamelements: "StreamElements" };
  const via = (e) => SERVICE[e.service] ? " on " + SERVICE[e.service] : "";
  const yt = (e) => e.platform === "youtube";
  const KINDS = [
    ["follow", "Follows", "♥", "#ff6b8a", "Community", (e) => [e.user, " followed"]],
    ["sub", "New Subs", "★", "#a970ff", "Subs", (e) => { const t = (e.alert && e.alert.amount) || (e.chatbot ? "" : e.amount); return yt(e) ? [e.user, " became a member"] : [e.user, " subscribed", t ? " (" + t + ")" : ""]; }],
    ["resub", "Resubs", "★", "#a970ff", "Subs", (e) => [e.user, yt(e) ? " is still a member" : " resubscribed", amt(e) ? " · " + amt(e) + (/\D/.test(amt(e)) ? "" : " months") : ""]],
    ["gift", "Gifted Subs", "\u{1F381}", "#c084fc", "Subs", (e) => [e.user || "Anonymous", " gifted " + (amt(e) || 1) + (yt(e) ? (n(e) === 1 ? " membership" : " memberships") : n(e) === 1 ? " sub" : " subs")]],
    ["watchstreak", "Watch Streaks", "\u{1F525}", "#ffb547", "Community", (e) => [e.user, " is on a " + amt(e) + "-stream watch streak"]],
    ["bits", "Bits", "◆", "#5ad1ff", "Money", (e) => [e.user || "Anonymous", " cheered " + amt(e) + " bits"]],
    ["kicks", "Kicks", "◆", "#53fc18", "Money", (e) => [e.user, " sent " + amt(e) + " Kicks"]],
    ["donation", "Donations", "$", "#4ad295", "Money", (e) => [e.user || "Someone", (yt(e) ? " sent a Super Chat of " : " donated ") + ((e.currency ? e.currency + " " : "") + (e.chatbot ? e.amount : amt(e))) + via(e)]],
    ["charity", "Charity", "❤", "#4ad295", "Money", (e) => [e.user, " gave " + amt(e) + " to charity"]],
    ["raid", "Raids", "⚑", "#ff8f4a", "Community", (e) => [e.user, " raided with " + amt(e) + (n(e) === 1 ? " viewer" : " viewers")]],
    ["shoutoutin", "Shoutouts to You", "\u{1F4E3}", "#ff8f4a", "Community", (e) => [e.user, " shouted you out"]],
    ["reward", "Channel Point Rewards", "◎", "#5ad1ff", "Community", (e) => [e.user, " redeemed " + (e.reward || "a reward")]],
    ["firstmsg", "First-Time Chatters", "\u{1F44B}", "#7aa2ff", "Chat", (e) => [e.user, " chatted for the first time"]],
    ["firstwords", "First Words This Stream", "\u{1F4AC}", "#7aa2ff", "Chat", (e) => [e.user, " said hello"]],
    ["vip", "New VIPs", "♦", "#e05ce0", "Community", (e) => [e.user, " is now a VIP"]],
    ["mod", "New Moderators", "⚔", "#3ccd6c", "Community", (e) => [e.user, " is now a moderator"]],
    ["hypetrain", "Hype Trains", "\u{1F682}", "#ff6bd6", "Stream", (e) => ["", "Hype train" + (amt(e) ? ": " + (/\D/.test(amt(e)) ? amt(e) : "level " + amt(e)) : " started")]],
    ["hypetrainend", "Hype Trains Ending", "\u{1F682}", "#ff6bd6", "Stream", (e) => ["", "Hype train ended at level " + (amt(e) || 1)]],
    ["poll", "Polls", "☰", "#8b91a1", "Stream", (e) => ["", "Poll: " + (e.message || "started")]],
    ["pollend", "Polls Ending", "☰", "#8b91a1", "Stream", (e) => ["", "Poll ended" + (e.winner ? ": " + e.winner + " won" : "")]],
    ["prediction", "Predictions", "⚖", "#8b91a1", "Stream", (e) => ["", "Prediction: " + (e.message || "started")]],
    ["predictionend", "Predictions Ending", "⚖", "#8b91a1", "Stream", (e) => ["", "Prediction ended" + (e.winner ? ": " + e.winner : "")]],
    ["adbreak", "Ad Breaks", "▶", "#8b91a1", "Stream", (e) => ["", "Ad break" + (amt(e) ? " (" + amt(e) + " s)" : "")]],
    ["online", "Going Live", "●", "#ff4f4f", "Stream", () => ["", "You went live"]],
    ["offline", "Going Offline", "○", "#8b91a1", "Stream", () => ["", "You went offline"]],
    ["ban", "Bans", "⛔", "#ff5c6c", "Stream", (e) => [e.user, " was banned"]],
    ["liked", "Liked Requests", "♫", "#ff6b8a", "Music", (e) => [e.user, " liked a requested song"]],
    ["game", "Game Changes", "\u{1F3AE}", "#8b91a1", "Stream", (e) => ["", "Now playing " + (e.message || e.amount || "a new game")]],
    // (chat commands: shown only with Chat Commands switched on, apart from the events above, so it's not
    // listed among them)
    /* opt-in */ ["command", "Chat Commands", "!", "#7aa2ff", "Chat", (e) => [e.user, " used " + (e.message || "a command")]],
  ];
  const OFF_FIRST = ["firstwords"];
  const GROUPS = ["Community", "Subs", "Money", "Chat", "Stream", "Music", "Other"];
  const kindOf = (t) => KINDS.find((k) => k[0] === t) || [t, t + " (alert)", "✦", "#8b91a1", "Other", (e) => [e.user, " " + t + (amt(e) ? " " + amt(e) : "")]];

  const store = {
    get(k, d) { try { const v = localStorage.getItem("omnipulse.feed." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("omnipulse.feed." + k, JSON.stringify(v)); } catch (e) {} },
  };
  const opt = { hidden: store.get("hidden", OFF_FIRST), newest: store.get("newest", true), compact: store.get("compact", false), platform: store.get("platform", true), msg: store.get("msg", true), cmds: store.get("cmds", false), size: store.get("size", "13"), from: store.get("from", "all"), look: store.get("look", "app"), accent: store.get("accent", "app"), font: store.get("font", "app"), corners: store.get("corners", "app"), density: store.get("density", "normal") };
  // (the look: the app theme's colours, its headings' font and its corners (OmniPulse sends them), or Classic, the
  // dock's own dark grey; an accent of its own; how close together)
  const CLASSIC = { bg: "#1b1d24", panel: "#23262f", line: "#2e323d", text: "#e6e8ee", muted: "#8b91a1", accent: "#7aa2ff", light: false, rounded: true, font: "" };
  const PALS = { sunset: "#ff8a5c", ocean: "#3ec7ff", candy: "#ff8fd8", mint: "#5ef2b8", fire: "#ffb03a", gold: "#ffd76e", mono: "#f2f2f2" };
  let appTheme = null, fontOn = "";
  function applyLook() {
    const t = opt.look === "classic" || !appTheme ? CLASSIC : appTheme, r = document.documentElement.style;
    r.setProperty("--bg", t.bg); r.setProperty("--panel", t.panel); r.setProperty("--line", t.line); r.setProperty("--text", t.text); r.setProperty("--dim", t.muted);
    r.setProperty("--accent", PALS[opt.accent] || t.accent);
    document.body.classList.toggle("light", !!t.light);
    document.body.classList.toggle("sq", opt.corners === "square" || (opt.corners !== "rounded" && !t.rounded));
    ["compact", "roomy"].forEach((d) => document.body.classList.toggle("d-" + d, opt.density === d));
    // (the theme's font: from Google Fonts, as OBS won't have it)
    const f = opt.font === "theme" ? t.font || "" : "";
    if (f && f !== fontOn) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(f).replace(/%20/g, "+") + ":wght@400;600;700&display=swap"; document.head.append(l); }
    fontOn = f;
    document.body.style.fontFamily = f ? '"' + f + '", "Segoe UI", system-ui, sans-serif' : "";
  }

  const items = [];
  const seenKinds = new Set(KINDS.map((k) => k[0]));
  let last = 0, paused = false, waiting = [];

  function setOpt(k, v) { opt[k] = v; store.set(k, v); render(); sendSettings(); }
  const PAGE = "activity";
  const SENT = () => opt;
  const TAKE = (o) => { Object.keys(opt).forEach((k) => { if (k in o) { opt[k] = o[k]; store.set(k, o[k]); } }); render(); };
  // (its settings kept by OmniPulse, on its Suite page: these follow them, and a change made here goes back)
  let setN = -1;
  function sendSettings() {
    fetch("/dock/do", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ do: "settings", page: PAGE, opt: SENT() }) }).catch(() => {});
  }
  async function pullSettings() {
    try {
      const j = await (await fetch("/dock/settings.json?page=" + PAGE, { cache: "no-store" })).json();
      if (JSON.stringify(j.theme || null) !== JSON.stringify(appTheme)) { appTheme = j.theme || null; applyLook(); }
      if (j.n === setN) return;
      setN = j.n;
      if (j.opt && typeof j.opt === "object") { TAKE(j.opt); } else { sendSettings(); }
    } catch (e) {}
  }
  setInterval(pullSettings, 3000);
  pullSettings();
  const shown = (e) => (e.type === "command" ? opt.cmds : !opt.hidden.includes(e.type)) && (opt.from === "all" || (e.platform || "twitch") === opt.from);

  function drawKinds() {
    const box = $("kinds");
    box.textContent = "";
    for (const g of GROUPS) {
      const list = [...seenKinds].map(kindOf).filter((k) => k[4] === g);
      if (!list.length) continue;
      const h = document.createElement("div"); h.className = "meta"; h.textContent = g; h.style.marginTop = "4px"; box.append(h);
      const grid = document.createElement("div"); grid.className = "grid";
      for (const k of list) {
        const l = document.createElement("label");
        const c = document.createElement("input"); c.type = "checkbox"; c.checked = !opt.hidden.includes(k[0]);
        c.onchange = () => setOpt("hidden", c.checked ? opt.hidden.filter((x) => x !== k[0]) : opt.hidden.concat([k[0]]));
        const dot = document.createElement("span"); dot.textContent = k[2]; dot.style.color = k[3];
        l.append(c, dot, document.createTextNode(" " + k[1]));
        grid.append(l);
      }
      box.append(grid);
    }
  }

  function ago(ts) {
    const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 45) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    const d = new Date(ts), today = new Date().toDateString() === d.toDateString();
    return (today ? "" : d.toLocaleDateString([], { day: "numeric", month: "short" }) + " ") + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  // ---------- icons, and a tip on hover saying what each does ----------
  const ICON = {
    trash: "M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z",
    timer: "M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.96 8.96 0 0 0 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z",
    ban: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8 0-1.85.63-3.55 1.69-4.9L16.9 18.31A7.902 7.902 0 0 1 12 20zm6.31-3.1L7.1 5.69A7.902 7.902 0 0 1 12 4c4.42 0 8 3.58 8 8 0 1.85-.63 3.55-1.69 4.9z",
    undo: "M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z",
    send: "M2.01 21L23 12 2.01 3 2 10l15 2-15 2z",
    replay: "M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z",
    bolt: "M7 2v11h3v9l7-12h-4l4-8z",
    refund: "M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z",
    check: "M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z",
    eraser: "M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.78-.78 2.05 0 2.83L5.03 20h7.66l8.72-8.72c.79-.78.79-2.05 0-2.83l-4.85-4.86c-.39-.39-.9-.59-1.42-.59zM6.24 18l-2.24-2.24 6.07-6.07 4.24 4.24L10.24 18H6.24z",
  };
  function svg(name) {
    const NS = "http://www.w3.org/2000/svg";
    const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", ICON[name]); s.append(p);
    return s;
  }
  // (an icon button: its icon, a word beside it if it needs one, and its tip)
  function iconButton(name, tip, word, cls, go) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "ib" + (cls ? " " + cls : ""); b.dataset.tip = tip; b.setAttribute("aria-label", tip);
    b.append(svg(name));
    if (word) { const w = document.createElement("span"); w.className = "w"; w.textContent = word; b.append(w); }
    b.onclick = (e) => { e.stopPropagation(); go(b); };
    return b;
  }

  function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200); }

  async function act(cmd, b, label) {
    try {
      const r = await fetch("/dock/do", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cmd) });
      const j = await r.json();
      if (!j.ok) { toast("Couldn't: " + (j.error || "no answer")); return; }
      if (b) { const was = b.dataset.tip; b.classList.add("done"); b.dataset.tip = label; setTimeout(() => { b.classList.remove("done"); b.dataset.tip = was; }, 1500); }
    } catch (e) { toast("OmniPulse isn't answering"); }
  }

  function row(e) {
    const k = kindOf(e.type);
    const r = document.createElement("div");
    r.className = "item"; r.style.setProperty("--c", k[3]);
    const g = document.createElement("div"); g.className = "glyph"; g.textContent = k[2]; g.style.color = k[3]; g.title = k[1];
    const what = document.createElement("div"); what.className = "what";
    const [who, rest, more] = k[5](e);
    const line = document.createElement("div");
    if (opt.platform && e.platform !== "all") { const p = document.createElement("span"); const pf = e.platform === "kick" ? "kick" : e.platform === "twitch" || (!e.platform && e.chatbot) ? "twitch" : "other"; p.className = "pf " + pf; p.textContent = pf === "kick" ? "K" : pf === "twitch" ? "T" : (e.platform || "?").slice(0, 2).toUpperCase(); line.append(p); }
    if (who) { const b = document.createElement("b"); b.textContent = who; line.append(b); }
    line.append(document.createTextNode((rest || "") + (more || "")));
    what.append(line);
    const said = e.type === "reward" ? e.message || e.rawInput : e.message;
    if (opt.msg && said && !["poll", "prediction", "game"].includes(e.type)) { const m = document.createElement("div"); m.className = "msg"; m.textContent = "“" + said + "”"; what.append(m); }
    const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = ago(e.ts); meta.dataset.ts = e.ts; what.append(meta);
    const acts = document.createElement("div"); acts.className = "acts";
    if (e.alert) acts.append(iconButton("replay", "Show its alert again", "", "", (b) => act({ do: "replay", n: e.n }, b, "Replayed")));
    // (a Twitch reward: its points given back, its redemption cancelled)
    if (e.type === "reward" && e.redemptionId && (e.platform || "twitch") === "twitch") acts.append(iconButton("refund", "Refund " + (e.user || "their") + "'s points", "", "", (b) => act({ do: "refund", rewardId: e.rewardId, redemptionId: e.redemptionId, user: e.user, reward: e.reward }, b, "Refunded")));
    if (e.chatbot) acts.append(iconButton("bolt", "Run the chatbot's actions for it again (its thanks in chat, its sounds...)", "", "", (b) => act({ do: "rerun", n: e.n }, b, "Ran them again")));
    r.append(g, what, acts);
    return r;
  }

  function render() {
    document.documentElement.style.setProperty("--fs", opt.size + "px");
    document.body.classList.toggle("compact", opt.compact);
    applyLook();
    $("oNewest").checked = opt.newest; $("oCompact").checked = opt.compact; $("oPlatform").checked = opt.platform; $("oMsg").checked = opt.msg; $("oCmds").checked = opt.cmds; $("oSize").value = opt.size; $("oFrom").value = opt.from;
    const feed = $("feed");
    const list = items.filter(shown);
    feed.querySelectorAll(".item").forEach((x) => x.remove());
    $("empty").hidden = list.length > 0;
    const ordered = opt.newest ? list.slice().reverse() : list;
    for (const e of ordered) feed.append(row(e));
    if (!opt.newest) feed.scrollTop = feed.scrollHeight;
    $("count").textContent = list.length ? list.length + (list.length === items.length ? "" : " of " + items.length) : "";
    drawKinds();
  }

  // (a new one: put in its place without drawing the rest again)
  function add(e) {
    items.push(e);
    while (items.length > 250) items.shift();
    if (!seenKinds.has(e.type)) { seenKinds.add(e.type); drawKinds(); }
    if (!shown(e)) { $("count").textContent = items.filter(shown).length + " of " + items.length; return; }
    const feed = $("feed"), r = row(e);
    $("empty").hidden = true;
    if (opt.newest) feed.insertBefore(r, $("empty").nextSibling);
    else { const stay = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40; feed.append(r); if (stay) feed.scrollTop = feed.scrollHeight; }
    r.animate([{ background: "color-mix(in srgb, " + kindOf(e.type)[3] + " 25%, transparent)" }, { background: "transparent" }], { duration: 1600 });
    const c = items.filter(shown).length;
    $("count").textContent = c + (c === items.length ? "" : " of " + items.length);
  }

  $("gear").onclick = () => $("settings").classList.toggle("open");
  $("pause").onclick = () => {
    paused = !paused;
    $("pause").setAttribute("aria-pressed", String(paused));
    $("pause").innerHTML = paused ? "&#9654;" : "&#10074;&#10074;";
    $("pause").dataset.tip = paused ? "Carry on (" + waiting.length + " waiting)" : "Pause the feed";
    if (!paused) { waiting.forEach(add); waiting = []; }
  };
  $("allOn").onclick = () => setOpt("hidden", []);
  $("allOff").onclick = () => setOpt("hidden", [...seenKinds]);
  $("money").onclick = () => setOpt("hidden", [...seenKinds].filter((t) => !["follow", "sub", "resub", "gift", "bits", "kicks", "donation", "charity"].includes(t)));
  $("oNewest").onchange = (e) => setOpt("newest", e.target.checked);
  $("oCompact").onchange = (e) => setOpt("compact", e.target.checked);
  $("oCmds").onchange = (e) => setOpt("cmds", e.target.checked);
  $("oPlatform").onchange = (e) => setOpt("platform", e.target.checked);
  $("oMsg").onchange = (e) => setOpt("msg", e.target.checked);
  $("oSize").onchange = (e) => setOpt("size", e.target.value);
  $("oFrom").onchange = (e) => setOpt("from", e.target.value);
  $("clear").onclick = () => {
    const b = $("clear");
    if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "Clear it? Click again"; setTimeout(() => { b.classList.remove("sure"); b.textContent = "Clear the Feed"; }, 3000); return; }
    b.classList.remove("sure"); b.textContent = "Clear the Feed";
    act({ do: "clearfeed" }).then(() => { items.length = 0; render(); });
  };
  setInterval(() => document.querySelectorAll(".meta[data-ts]").forEach((m) => { m.textContent = ago(Number(m.dataset.ts)); }), 30000);

  let first = true, failing = false;
  async function poll() {
    try {
      const r = await fetch("/dock/activity.json?after=" + last, { cache: "no-store" });
      const j = await r.json();
      if (j.last < last) { last = 0; items.length = 0; first = true; }
      const got = (j.items || []).filter((e) => e.n > last);
      got.forEach((e) => { last = Math.max(last, e.n); });
      if (first) { first = false; got.forEach((e) => { items.push(e); seenKinds.add(e.type); }); render(); }
      else if (paused) waiting.push(...got);
      else got.forEach(add);
      if (failing) { failing = false; toast("OmniPulse is back"); }
    } catch (e) {
      if (!failing) { failing = true; toast("Can't reach OmniPulse: is it open, with the Stream Widget on?"); }
    }
    setTimeout(poll, failing ? 3000 : 1000);
  }
  render();
  poll();
</script>
<div id="tip" role="tooltip"></div>
<script>
  // ---------- the tip on hover: below what it's for, or above it if there's no room, and moved in from
  // the sides so it never draws outside the dock (the browser's own title tips are turned into these too) ----------
  (() => {
    const tip = document.getElementById("tip");
    let on = null;
    const place = () => {
      if (!on || !on.isConnected || !on.dataset.tip) { tip.classList.remove("show"); on = null; return; }
      if (tip.textContent !== on.dataset.tip) tip.textContent = on.dataset.tip;
      tip.classList.add("show");
      const r = on.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight, gap = 6, edge = 4;
      let y = r.bottom + gap;
      if (y + h > innerHeight - edge) y = r.top - gap - h;
      y = Math.min(Math.max(edge, y), innerHeight - h - edge);
      const x = Math.min(Math.max(edge, r.right - w), innerWidth - w - edge);
      tip.style.left = Math.max(edge, x) + "px"; tip.style.top = Math.max(edge, y) + "px";
    };
    document.addEventListener("mouseover", (e) => {
      const t = e.target.closest ? e.target.closest("[title],[data-tip]") : null;
      if (t && t.hasAttribute("title")) {
        if (t.title) { t.dataset.tip = t.title; if (!t.hasAttribute("aria-label")) t.setAttribute("aria-label", t.title); }
        t.removeAttribute("title");
      }
      const next = t && t.dataset.tip ? t : null;
      if (next !== on) { on = next; place(); }
    });
    document.addEventListener("mouseout", (e) => { if (on && !on.contains(e.relatedTarget)) { on = null; place(); } });
    document.addEventListener("mousedown", (e) => { if (on && on.tagName === "SELECT") { on = null; place(); } }, true);
    addEventListener("scroll", () => { if (on) place(); }, true);
    addEventListener("blur", () => { on = null; place(); });
    // (a tip that changes while it's showing, like "Click again to ban", is shown changed)
    new MutationObserver((ms) => { if (on && ms.some((m) => m.target !== tip && !tip.contains(m.target))) place(); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-tip"] });
  })();
</script>
