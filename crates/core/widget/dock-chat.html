<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniPulse Chat</title>
<style>
  /* OmniPulse's chat dock, for OBS (Docks > Custom Browser Docks): Twitch and Kick chat as the chatbot
     hears it, each message with its moderation buttons, and a box to chat back */
  :root {
    --bg: #1b1d24; --panel: #23262f; --line: #2e323d; --text: #e6e8ee; --dim: #8b91a1; --accent: #7aa2ff;
    --twitch: #9146ff; --kick: #53fc18; --danger: #ff5c6c; --warn: #ffb547; --ok: #4ad295; --fs: 13px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: var(--fs) / 1.4 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  header { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
  header h1 { margin: 0 auto 0 2px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 1px 9px; font-size: 11px; color: var(--dim); }
  .chip[aria-pressed="true"] { color: var(--text); border-color: currentColor; }
  .chip.twitch[aria-pressed="true"] { color: #bf9bff; }
  .chip.kick[aria-pressed="true"] { color: var(--kick); }
  .icon { border: 0; background: transparent; color: var(--dim); padding: 2px 5px; border-radius: 6px; font-size: 14px; line-height: 1; }
  .icon:hover { color: var(--text); background: var(--line); }
  .icon { position: relative; }
  .icon[data-tip]:hover::after, .chip[data-tip]:hover::after { content: attr(data-tip); position: absolute; right: 0; top: calc(100% + 6px); white-space: nowrap; background: #000c; color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 6px; pointer-events: none; z-index: 20; }
  .chip { position: relative; }

  #settings { display: none; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); gap: 6px 14px; flex-wrap: wrap; font-size: 12px; flex: none; }
  #settings.open { display: flex; }
  #settings label { display: flex; align-items: center; gap: 5px; color: var(--dim); }

  #log { flex: 1; overflow-y: auto; padding: 4px 0 8px; overscroll-behavior: contain; }
  .msg { position: relative; padding: 3px 8px 3px 10px; border-left: 2px solid transparent; word-wrap: break-word; }
  .msg:hover { background: #ffffff08; }
  .msg.twitch { border-left-color: #9146ff55; }
  .msg.kick { border-left-color: #53fc1855; }
  .msg.first { background: #7aa2ff14; }
  .msg.gone .text { text-decoration: line-through; color: var(--dim); }
  .msg.me .text { font-style: italic; }
  .time { color: var(--dim); font-size: 0.85em; margin-right: 4px; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; min-width: 15px; padding: 0 3px; margin-right: 3px; border-radius: 3px; font-size: 0.75em; font-weight: 700; text-align: center; vertical-align: 1px; color: #111; }
  .badge.b { background: #ff4f4f; } .badge.m { background: #3ccd6c; } .badge.v { background: #e05ce0; } .badge.s { background: #7aa2ff; } .badge.f { background: #ffb547; }
  .name { font-weight: 700; cursor: pointer; }
  .name:hover { text-decoration: underline; }
  .text img { height: 1.6em; vertical-align: middle; margin: -0.3em 0; }
  .tag { font-size: 0.75em; color: var(--accent); margin-left: 4px; }
  .notice { color: var(--dim); font-style: italic; padding: 3px 10px; }
  .notice.bad { color: var(--warn); }

  /* the moderation buttons: on every message (not yours), clearer on the one under the mouse */
  .mod { display: inline-flex; gap: 2px; margin-left: 6px; vertical-align: 1px; opacity: 0.35; }
  .msg:hover .mod, .mod:focus-within { opacity: 1; }
  body.modhover .mod { display: none; }
  body.modhover .msg:hover .mod, body.modhover .mod:focus-within { display: inline-flex; }
  /* icon buttons, and their tips (drawn here: shown above, kept inside the dock) */
  .ib { position: relative; display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 4px; color: var(--dim); line-height: 1; cursor: pointer; }
  .ib svg { width: 14px; height: 14px; fill: currentColor; }
  .ib .w { font-size: 9.5px; font-weight: 700; }
  .ib:hover { color: var(--text); border-color: var(--dim); }
  .ib[data-tip]:hover::after { content: attr(data-tip); position: absolute; right: 0; bottom: calc(100% + 6px); white-space: nowrap; background: #000c; color: #fff; font-size: 11px; font-weight: 400; padding: 4px 8px; border-radius: 6px; pointer-events: none; z-index: 20; }
  .mod .ib.ban:hover, .mod .ib.sure { color: #fff; background: var(--danger); border-color: var(--danger); }
  .mod .ib.unban:hover { color: #111; background: var(--ok); border-color: var(--ok); }
  .mod .ib.del:hover { color: #fff; background: #5b6172; }
  form .ib { padding: 0 10px; background: var(--accent); color: #111; border-color: var(--accent); }
  form .ib svg { width: 16px; height: 16px; }

  #more { position: absolute; left: 50%; transform: translateX(-50%); bottom: 64px; display: none; border: 0; border-radius: 999px; padding: 4px 12px; background: var(--accent); color: #111; font-weight: 600; font-size: 12px; box-shadow: 0 4px 14px #0008; }
  #more.show { display: block; }

  form { display: flex; gap: 6px; padding: 6px 8px; background: var(--panel); border-top: 1px solid var(--line); flex: none; }
  form select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0 4px; }
  form input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  form input:focus, form select:focus { outline: none; border-color: var(--accent); }
  form button { border: 0; border-radius: 6px; padding: 0 12px; background: var(--accent); color: #111; font-weight: 600; }
  #empty { color: var(--dim); text-align: center; padding: 24px 16px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Chat</h1>
  <button class="chip twitch" id="fTwitch" aria-pressed="true" data-tip="Show or hide Twitch's chat">Twitch</button>
  <button class="chip kick" id="fKick" aria-pressed="true" data-tip="Show or hide Kick's chat">Kick</button>
  <button class="icon" id="gear" data-tip="This dock's settings" aria-label="Settings">&#9881;</button>
</header>
<div id="settings">
  <label><input type="checkbox" id="oTime"> Times</label>
  <label><input type="checkbox" id="oBadges" checked> Badges</label>
  <label><input type="checkbox" id="oHover"> Buttons only on hover</label>
  <label><input type="checkbox" id="oConfirm" checked> Ask before banning</label>
  <label>Time-out <select id="oSecs"><option value="60">1 min</option><option value="300">5 min</option><option value="600" selected>10 min</option><option value="3600">1 hour</option><option value="86400">1 day</option></select></label>
  <label>Text <select id="oSize"><option value="12">Small</option><option value="13" selected>Normal</option><option value="15">Large</option><option value="17">Larger</option></select></label>
  <button class="chip" id="clearView" type="button">Clear the View</button>
</div>
<div id="log"><div id="empty">Chat shows here while OmniPulse's chatbot is on (Settings &gt; Streaming), signed in to Twitch or Kick.</div></div>
<button id="more" type="button">New messages &#8595;</button>
<form id="send" autocomplete="off">
  <select id="to" title="Where it goes"><option value="all">Both</option><option value="twitch">Twitch</option><option value="kick">Kick</option></select>
  <input id="text" maxlength="500" placeholder="Send a message">
  <button type="submit" class="ib" data-tip="Send it" aria-label="Send it"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
</form>
<script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  const log = $("log");
  // (this dock's own choices: kept in OBS's browser, never needed)
  const store = {
    get(k, d) { try { const v = localStorage.getItem("omnipulse.chat." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("omnipulse.chat." + k, JSON.stringify(v)); } catch (e) {} },
  };
  const opt = {
    twitch: store.get("twitch", true), kick: store.get("kick", true), time: store.get("time", false), badges: store.get("badges", true),
    hover: store.get("hover", false), confirm: store.get("confirm", true), secs: store.get("secs", "600"), size: store.get("size", "13"), to: store.get("to", "all"),
    bttv: store.get("bttv", true), ffz: store.get("ffz", true), stv: store.get("stv", true),
  };
  let last = 0, cleared = 0;
  const rows = new Map();

  function applyOpts() {
    $("fTwitch").setAttribute("aria-pressed", String(opt.twitch));
    $("fKick").setAttribute("aria-pressed", String(opt.kick));
    $("oTime").checked = opt.time; $("oBadges").checked = opt.badges; $("oHover").checked = opt.hover; $("oConfirm").checked = opt.confirm;
    $("oSecs").value = opt.secs; $("oSize").value = opt.size; $("to").value = opt.to;
    document.documentElement.style.setProperty("--fs", opt.size + "px");
    document.body.classList.toggle("modhover", opt.hover);
    for (const [, r] of rows) show(r);
  }
  function setOpt(k, v) { opt[k] = v; store.set(k, v); applyOpts(); sendSettings(); }
  const PAGE = "chat";
  const SENT = () => opt;
  const TAKE = (o) => { Object.keys(opt).forEach((k) => { if (k in o) { opt[k] = o[k]; store.set(k, o[k]); } }); applyOpts(); };
  // (its settings kept by OmniPulse, on its Suite page: these follow them, and a change made here goes back)
  let setN = -1;
  function sendSettings() {
    fetch("/dock/do", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ do: "settings", page: PAGE, opt: SENT() }) }).catch(() => {});
  }
  async function pullSettings() {
    try {
      const j = await (await fetch("/dock/settings.json?page=" + PAGE, { cache: "no-store" })).json();
      if (j.n === setN) return;
      setN = j.n;
      if (j.opt && typeof j.opt === "object") { TAKE(j.opt); } else { sendSettings(); }
    } catch (e) {}
  }
  setInterval(pullSettings, 3000);
  pullSettings();
  function show(r) {
    const p = r.dataset.platform;
    r.hidden = (p === "twitch" && !opt.twitch) || (p === "kick" && !opt.kick);
    const t = r.querySelector(".time"); if (t) t.hidden = !opt.time;
    r.querySelectorAll(".badge").forEach((b) => { b.hidden = !opt.badges; });
  }

  $("fTwitch").onclick = () => setOpt("twitch", !opt.twitch);
  $("fKick").onclick = () => setOpt("kick", !opt.kick);
  $("gear").onclick = () => $("settings").classList.toggle("open");
  $("oTime").onchange = (e) => setOpt("time", e.target.checked);
  $("oBadges").onchange = (e) => setOpt("badges", e.target.checked);
  $("oHover").onchange = (e) => setOpt("hover", e.target.checked);
  $("oConfirm").onchange = (e) => setOpt("confirm", e.target.checked);
  $("oSecs").onchange = (e) => setOpt("secs", e.target.value);
  $("oSize").onchange = (e) => setOpt("size", e.target.value);
  $("to").onchange = (e) => setOpt("to", e.target.value);
  $("clearView").onclick = () => { cleared = last; log.querySelectorAll(".msg, .notice").forEach((r) => r.remove()); rows.clear(); };

  // ---------- a message: its emotes as pictures (Twitch's by place, Kick's by their [emote:id:name]) ----------
  function emoteImg(src, name) { const i = document.createElement("img"); i.src = src; i.alt = name; i.title = name; return i; }

  // (BetterTTV, FrankerFaceZ and 7TV emotes: their words in a message as pictures, as its switches say;
  // OmniPulse fetches the lists, global and your channel's, and they're taken again as they change)
  let emotes = new Map(), emotesN = -1;
  async function pullEmotes() {
    try {
      const j = await (await fetch("/dock/emotes.json", { cache: "no-store" })).json();
      if (j.n === emotesN) return;
      emotesN = j.n;
      const m = new Map();
      (j.list || []).forEach((e) => m.set(e.c, e));
      emotes = m;
    } catch (e) {}
  }
  pullEmotes();
  setInterval(pullEmotes, 60000);
  function thirdParty(nodes, img) {
    if (!emotes.size) return nodes;
    const on = { bttv: opt.bttv !== false, ffz: opt.ffz !== false, "7tv": opt.stv !== false };
    const out = [];
    for (const n of nodes) {
      if (n.nodeType !== 3) { out.push(n); continue; }
      const parts = n.textContent.split(/(\s+)/);
      let text = "";
      for (const w of parts) {
        const e = w && emotes.get(w);
        if (e && on[e.f]) { if (text) out.push(document.createTextNode(text)); text = ""; out.push(img(e.u, w)); }
        else text += w;
      }
      if (text) out.push(document.createTextNode(text));
    }
    return out;
  }
  function textNodes(m) { return thirdParty(ownNodes(m), emoteImg); }
  function ownNodes(m) {
    const out = [];
    const text = String(m.text || "");
    if (m.platform === "kick") {
      const re = /\[emote:(\d+):([^\]]*)\]/g;
      let at = 0, x;
      while ((x = re.exec(text))) {
        if (x.index > at) out.push(document.createTextNode(text.slice(at, x.index)));
        out.push(emoteImg("https://files.kick.com/emotes/" + x[1] + "/fullsize", x[2]));
        at = x.index + x[0].length;
      }
      if (at < text.length) out.push(document.createTextNode(text.slice(at)));
      return out;
    }
    // (Twitch's: "id:start-end,start-end/id:..." counted in characters, not UTF-16)
    const chars = Array.from(text), spots = [];
    String(m.emotes || "").split("/").filter(Boolean).forEach((part) => {
      const [id, places] = part.split(":");
      (places || "").split(",").forEach((p) => { const [a, b] = p.split("-").map(Number); if (b >= a) spots.push([a, b, id]); });
    });
    spots.sort((x, y) => x[0] - y[0]);
    let at = 0;
    for (const [a, b, id] of spots) {
      if (a < at) continue;
      if (a > at) out.push(document.createTextNode(chars.slice(at, a).join("")));
      const name = chars.slice(a, b + 1).join("");
      out.push(emoteImg("https://static-cdn.jtvnw.net/emoticons/v2/" + encodeURIComponent(id) + "/default/dark/1.0", name));
      at = b + 1;
    }
    if (at < chars.length) out.push(document.createTextNode(chars.slice(at).join("")));
    return out;
  }

  const BADGES = [["broadcaster", "b", "B", "Streamer"], ["moderator", "m", "M", "Moderator"], ["vip", "v", "V", "VIP"], ["founder", "f", "F", "Founder"], ["og", "f", "OG", "OG"], ["subscriber", "s", "S", "Subscriber"]];
  // (a name's colour: its own, or one picked from the name, readable on the dark)
  function colourOf(m) {
    if (/^#[0-9a-f]{6}$/i.test(m.color || "")) return m.color;
    let h = 0;
    for (const c of String(m.login || m.user || "")) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return "hsl(" + (h % 360) + " 70% 68%)";
  }

  function stamp(ts) { const d = new Date(ts); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

  function button(label, cls, title, go) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.title = title; if (cls) b.className = cls;
    b.onclick = (e) => { e.stopPropagation(); go(b); };
    return b;
  }

  // ---------- icons, and a tip on hover saying what each does ----------
  const ICON = {
    trash: "M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z",
    timer: "M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.96 8.96 0 0 0 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z",
    ban: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8 0-1.85.63-3.55 1.69-4.9L16.9 18.31A7.902 7.902 0 0 1 12 20zm6.31-3.1L7.1 5.69A7.902 7.902 0 0 1 12 4c4.42 0 8 3.58 8 8 0 1.85-.63 3.55-1.69 4.9z",
    undo: "M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z",
    send: "M2.01 21L23 12 2.01 3 2 10l15 2-15 2z",
    replay: "M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z",
    bolt: "M7 2v11h3v9l7-12h-4l4-8z",
    check: "M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z",
    eraser: "M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.78-.78 2.05 0 2.83L5.03 20h7.66l8.72-8.72c.79-.78.79-2.05 0-2.83l-4.85-4.86c-.39-.39-.9-.59-1.42-.59zM6.24 18l-2.24-2.24 6.07-6.07 4.24 4.24L10.24 18H6.24z",
  };
  function svg(name) {
    const NS = "http://www.w3.org/2000/svg";
    const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", ICON[name]); s.append(p);
    return s;
  }
  // (an icon button: its icon, a word beside it if it needs one, and its tip)
  function iconButton(name, tip, word, cls, go) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "ib" + (cls ? " " + cls : ""); b.dataset.tip = tip; b.setAttribute("aria-label", tip);
    b.append(svg(name));
    if (word) { const w = document.createElement("span"); w.className = "w"; w.textContent = word; b.append(w); }
    b.onclick = (e) => { e.stopPropagation(); go(b); };
    return b;
  }

  function modButtons(m) {
    const box = document.createElement("span");
    box.className = "mod";
    const base = { platform: m.platform, id: m.id, user: m.user, login: m.login, userId: m.userId };
    const ask = (what, extra) => act(Object.assign({ do: what }, base, extra || {}));
    const secs = () => Number(opt.secs) || 600;
    const short = () => { const s = secs(); return s >= 86400 ? s / 86400 + "d" : s >= 3600 ? s / 3600 + "h" : s / 60 + "m"; };
    if (m.id) box.append(iconButton("trash", "Delete this message", "", "del", () => ask("delete")));
    box.append(iconButton("timer", "Time out " + m.user + " for a minute", "1m", "", () => ask("timeout", { seconds: 60 })));
    const t = iconButton("timer", "Time out " + m.user + " for " + short(), short(), "", () => ask("timeout", { seconds: secs() }));
    t.onmouseenter = () => { t.querySelector(".w").textContent = short(); t.dataset.tip = "Time out " + m.user + " for " + short(); };
    box.append(t);
    // (a ban: asked twice, unless that's switched off)
    box.append(iconButton("ban", "Ban " + m.user, "", "ban", (b) => {
      if (opt.confirm && !b.classList.contains("sure")) { b.classList.add("sure"); b.dataset.tip = "Click again to ban " + m.user; setTimeout(() => { b.classList.remove("sure"); b.dataset.tip = "Ban " + m.user; }, 3000); return; }
      b.classList.remove("sure"); b.dataset.tip = "Ban " + m.user;
      ask("ban");
    }));
    box.append(iconButton("undo", "Let " + m.user + " back in (after a ban or time-out)", "", "unban", () => ask("unban")));
    return box;
  }

  function addMessage(m) {
    if (m.notice) return addNotice(m.notice, /^Couldn't/.test(m.notice));
    const r = document.createElement("div");
    r.className = "msg " + (m.platform === "kick" ? "kick" : "twitch") + (m.first ? " first" : "") + (m.me ? " me" : "") + (m.gone ? " gone" : "");
    r.dataset.platform = m.platform === "kick" ? "kick" : "twitch";
    const time = document.createElement("span"); time.className = "time"; time.textContent = stamp(m.ts); r.append(time);
    for (const [key, cls, label, title] of BADGES) {
      if ((m.badges || []).includes(key)) { const b = document.createElement("span"); b.className = "badge " + cls; b.textContent = label; b.title = title; r.append(b); }
    }
    const name = document.createElement("span");
    name.className = "name"; name.textContent = m.user || m.login || "?"; name.style.color = colourOf(m);
    name.title = (m.platform === "kick" ? "Kick" : "Twitch") + ": click to reply to " + (m.user || "them");
    name.onclick = () => { const i = $("text"); i.value = "@" + (m.user || m.login) + " " + i.value.replace(/^@\S+\s*/, ""); $("to").value = m.platform === "kick" ? "kick" : "twitch"; i.focus(); };
    r.append(name, document.createTextNode(m.me ? " " : ": "));
    const text = document.createElement("span"); text.className = "text"; text.append(...textNodes(m)); r.append(text);
    if (m.first) { const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "first message"; r.append(tag); }
    if (!m.self) r.append(modButtons(m));
    rows.set(m.n, r);
    show(r);
    place(r);
  }

  function addNotice(text, bad) {
    const r = document.createElement("div");
    r.className = "notice" + (bad ? " bad" : "");
    r.textContent = text;
    place(r);
  }

  // (kept at the bottom while you're there; scrolled up, it waits, and says new ones came)
  function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 40; }
  function place(r) {
    const stay = atBottom();
    $("empty").hidden = true;
    log.append(r);
    while (log.children.length > 400) { const x = log.children[1]; for (const [n, v] of rows) if (v === x) rows.delete(n); x.remove(); }
    if (stay) log.scrollTop = log.scrollHeight; else $("more").classList.add("show");
  }
  log.onscroll = () => { if (atBottom()) $("more").classList.remove("show"); };
  $("more").onclick = () => { log.scrollTop = log.scrollHeight; $("more").classList.remove("show"); };

  async function act(cmd) {
    try {
      const r = await fetch("/dock/do", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cmd) });
      const j = await r.json();
      if (!j.ok) addNotice("Couldn't: " + (j.error || "no answer"), true);
    } catch (e) { addNotice("OmniPulse isn't answering (is it open, with the Stream Widget on?)", true); }
  }

  $("send").onsubmit = (e) => {
    e.preventDefault();
    const text = $("text").value.trim();
    if (!text) return;
    act({ do: "say", text, platform: $("to").value });
    $("text").value = "";
  };

  let failing = false;
  async function poll() {
    try {
      const r = await fetch("/dock/chat.json?after=" + last, { cache: "no-store" });
      const j = await r.json();
      // (OmniPulse restarted: its numbering began again)
      if (j.last < last) last = 0;
      for (const m of j.items || []) { if (m.n > cleared) addMessage(m); last = Math.max(last, m.n); }
      for (const n of j.gone || []) { const row = rows.get(n); if (row) row.classList.add("gone"); }
      if (failing) { failing = false; addNotice("OmniPulse is back."); }
    } catch (e) {
      if (!failing) { failing = true; addNotice("Can't reach OmniPulse: is it open, with the Stream Widget on?", true); }
    }
    setTimeout(poll, failing ? 3000 : 700);
  }
  applyOpts();
  poll();
</script>
</body>
</html>
