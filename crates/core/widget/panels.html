<!--
  Your channel panels, made in the Stream Suite (Settings > Streaming > Suite > Creators > Panels): each one
  drawn here at Twitch's panel size (320 wide, at twice that for sharpness), in one theme, with Save as PNG for
  each and for all of them. Upload them on Twitch (your channel, About, Edit Panels) or Kick. /panels; it reads
  /now.json's suite.creators.
-->

  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lede { margin: 0 0 22px; color: #a9a5ba; font-size: 14px; }
  .row { display: flex; align-items: center; gap: 16px; margin: 0 0 14px; }
  canvas { width: 320px; border-radius: 6px; background: repeating-conic-gradient(#2a2733 0 25%, #221f2b 0 50%) 0 0 / 16px 16px; }
  button { font: 600 13px "Segoe UI", sans-serif; color: #fff; background: #3a3550; border: 1px solid #555070; border-radius: 9px; padding: 8px 14px; cursor: pointer; }
  button:hover { background: #4a4466; }
  button.all { background: linear-gradient(135deg, #8e9bff, #ff7ac8); border: 0; margin-bottom: 22px; }
  .name { color: #a9a5ba; font-size: 12px; }
</style>
</head>

    if (th === "terminal") { c.fillStyle = o.ink; c.fillRect(x + c.measureText(t).width + 4, y - fs * 0.4, fs * 0.52, fs * 0.82); }
  }
  const titleText = (th, t) => (th === "terminal" ? "> " : "") + (UPPER.has(th) ? t.toUpperCase() : t) + (th === "terminal" ? "__" : "");

  // One panel: its title (and line under it), in the set's theme and shape; extended, its words under the title
  function draw(cv, p, set) {
    const th = set.theme || "dark", shape = set.shape || "rounded";
    const top = TOP[th] || 0, keepT = KEEP_TITLE[th] || 0, keepB = KEEP_BODY[th] || 0;
    // (extended, as set; or its line won't fit on one line beside its title, so it's extended to fit it all)
    const probe = document.createElement("canvas").getContext("2d");
    probe.font = "500 11px " + FONT(th);
    const room = W - (set.icons !== false ? 84 : 22) - 18 - keepT;
    // (more than one line of words, or a list: always under the title)
    const lines = String(p.line || "").split(/\r?\n/);
    const ext = !!p.line && (!!set.extended || lines.length > 1 || !!parseRich(lines[0]).mark || probe.measureText(plainOf(p.line)).width > room);
    let H = { short: 80, medium: 100, tall: 160, square: 320 }[set.height] || 100;
    let body = [];
    const bw = W - 44 - keepB;
    if (ext) {
      // (as tall as its words need: a header, then the lines)
      const m = document.createElement("canvas").getContext("2d");
      p.fs = 14; body = wrapRich(m, p.line, bw, p.fs, FONT(th));
      if (body.length > 10) { p.fs = 12.5; body = wrapRich(m, p.line, bw, p.fs, FONT(th)); }
      p.lh = Math.round(p.fs * 1.4);
      // (Twitch's tallest is 600: smaller words first, down to 10 px; then the last line ends in ...)
      const head = 74 + 18 + top;
      while (head + body.length * p.lh > MAX_H && p.fs > 10) { p.fs -= 0.5; p.lh = Math.round(p.fs * 1.36); body = wrapRich(m, p.line, bw, p.fs, FONT(th)); }
      const fit = Math.floor((MAX_H - head) / p.lh);
      if (body.length > fit) {
        body = body.slice(0, fit);
        const last = body[fit - 1];
        last.runs.push({ t: "…", b: false, i: false, u: false });
        while (richWidth(m, last, p.fs, FONT(th)) > bw && last.runs.length > 1) { const r = last.runs[last.runs.length - 2]; if (r.t.length > 1) r.t = r.t.slice(0, -1); else last.runs.splice(last.runs.length - 2, 1); }
      }
      H = Math.min(MAX_H, head + body.length * p.lh);
    }
    cv.width = W * SCALE; cv.height = H * SCALE;
    const c = cv.getContext("2d");
    c.scale(SCALE, SCALE);
    c.clearRect(0, 0, W, H);
    const c1 = (set.colors && set.colors.c1) || "#8e9bff", c2 = (set.colors && set.colors.c2) || "#ff7ac8";
    const r = shape === "square" ? 0 : shape === "pill" ? H / 2 : 14;
    const m = th === "comic" || th === "y2k" ? 6 : 3;
    const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, c1); g.addColorStop(1, c2);
    // (its panel)
    const own = (v) => /^#[0-9a-f]{6}$/i.test(String(v || "")) ? v : "";
    const o = panelArt(c, th, p, ext, W, H, m, r, c1, c2, g, own(set.bg));
    // (your own colour for the words, if set)
    if (own(set.ink)) {
      const behind = own(set.bg) || PLAIN_BG[th];
      const ink = behind && contrast(set.ink, behind) < 3 ? (lum(behind) > 0.5 ? "#111111" : "#ffffff") : set.ink;
      o.ink = ink; o.sub = alpha(ink, 0.85);
    }
    const ink = o.ink, sub = o.sub, font = FONT(th);
    // (extended: a header (icon and title) and the words under it, with a line between)
    if (ext) {
      let x = 22;
      if (p.logo) { logo(c, x - 2, top + 15, 40, set, c1, c2, ink); x += 52; }
      else if (set.icons !== false) { tile(c, th, p, x, top + 18, 36, c1, g, ink); x += 36 + 14; }
      c.textAlign = "left"; c.textBaseline = "middle";
      let fs = 24;
      c.font = "800 " + fs + "px " + font;
      while (c.measureText(titleText(th, p.title)).width > W - x - 18 - keepT && fs > 12) { fs -= 1; c.font = "800 " + fs + "px " + font; }
      title(c, th, p.title, x, top + 36, fs, o, th === "minimal" ? g : ink);
      const lg = c.createLinearGradient(22, 0, W - 22, 0); lg.addColorStop(0, c1); lg.addColorStop(1, c2);
      c.fillStyle = th === "comic" || th === "bauhaus" ? "#111" : lg; c.fillRect(22, top + 64, bw, 2);
      halo(c, th, ink, true);
      body.forEach((l, i) => drawRich(c, l, 22, top + 84 + i * p.lh, p.fs, font, sub, ink));
      halo(c, th, ink, false);
      return;
    }
    // (its icon, in a tile of its colours)
    let x = 22;
    if (p.logo) {
      const s = Math.min(54, H - top - 26);
      logo(c, x - 4, top + (H - top - s) / 2, s, set, c1, c2, ink);
      x += s + 10;
    } else if (set.icons !== false) {
      const s = Math.min(46, H - top - 34);
      tile(c, th, p, x, top + (H - top - s) / 2, s, c1, g, ink);
      x += s + 16;
    }
    // (its words)
    c.textAlign = "left"; c.textBaseline = "middle";
    const big = Math.min(30, (H - top) * 0.32);
    let fs = big;
    c.font = "800 " + fs + "px " + font;
    while (c.measureText(titleText(th, p.title)).width > W - x - 18 - keepT && fs > 12) { fs -= 1; c.font = "800 " + fs + "px " + font; }
    const mid = top + (H - top) / 2;
    title(c, th, p.title, x, p.line ? mid - fs * 0.38 : mid, fs, o, th === "minimal" ? g : ink);
    if (p.line) {
      // (its line, smaller until it fits: never cut off)
      // (a little smaller first; still too long, two lines, the title moved up for them)
      const room = W - x - 18 - keepT;
      // (as formatted, on one line; too long for one, plain over two)
      const one = { runs: parseRich(p.line).runs, indent: 0, mark: "" };
      let ls = Math.max(11, fs * 0.46);
      while (richWidth(c, one, ls, font) > room && ls > 10) ls -= 0.5;
      c.fillStyle = sub;
      halo(c, th, ink, true);
      if (richWidth(c, one, ls, font) <= room) drawRich(c, one, x, mid + fs * 0.5, ls, font, sub, ink);
      else {
        c.font = "500 " + ls + "px " + font;
        const two = wrap(c, plainOf(p.line), room);
        if (two.length > 2) { let l = two[1]; while (c.measureText(l + "…").width > room && l.length) l = l.slice(0, -1); two.splice(1, two.length - 1, l + "…"); }
        two.forEach((l, i) => c.fillText(l, x, mid + fs * 0.42 + i * (ls + 3)));
      }
      halo(c, th, ink, false);
    }
  }
  function save(cv, name) {
    cv.toBlob((b) => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name.replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() + ".png"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, "image/png");
  }
  let sig = "", made = [];
  // A Google Font's stylesheet, added once: resolved when it's in (or failed), so its font can be asked for
  const sheets = {};
  function fontSheet(name) {
    const id = "gf-" + name.replace(/ /g, "-");
    if (sheets[id]) return sheets[id];
    sheets[id] = new Promise((done) => {
      const l = document.createElement("link"); l.rel = "stylesheet"; l.id = id;
      l.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(name).replace(/%20/g, "+") + ":ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,700&display=swap";
      l.onload = l.onerror = () => done();
      document.head.appendChild(l);
      setTimeout(done, 6000);
    });
    return sheets[id];
  }
  // (a font come in after they were drawn: drawn again)
  if (document.fonts) document.fonts.addEventListener("loadingdone", () => { sig = ""; });
  async function poll() {
    try {
      const s = await (await fetch("/now.json", { cache: "no-store" })).json();
      const set = ((s.suite && s.suite.creators) || []).find((x) => x.kind === "panels");
      if (set) {
        if (!set.colors && s.accent) set.colors = { c1: s.accent, c2: s.accent2 || s.accent };
        SCALE = Number(set.scale) === 1 ? 1 : 2;
        // (its font: loaded before they're drawn, as a canvas draws only what's loaded)
        SET_FONT = String(set.font || "").replace(/[^A-Za-z0-9 ]/g, "").trim();
        // (its stylesheet waited for first: asked before that, the font isn't known yet and "loads" at once, empty,
        // and the panels were drawn in the fallback, never again once it came)
        if (SET_FONT) await fontSheet(SET_FONT);
        if (SET_FONT) { try { await Promise.all(["400 14px", "500 14px", "700 14px", "800 28px", "italic 500 14px"].map((w) => document.fonts.load(w + ' "' + SET_FONT + '"'))); } catch (e) {} }
        const next = JSON.stringify(set) + "|" + (SET_FONT && document.fonts.check('500 14px "' + SET_FONT + '"') ? "font" : "");
        if (next !== sig) {
          sig = next;
          const list = $("list"); list.innerHTML = ""; made = [];
          const all = (set.panels || []).slice();
          if (set.powered) all.push({ title: "Powered by OmniPulse", line: set.extended ? "This stream's music, chatbot, alerts and overlays all run on OmniPulse." + (set.site ? "\nGet it at " + set.site : "") : (set.site || "Music, chatbot and stream tools in one app"), icon: "omni", logo: true });
          all.forEach((p, i) => { p.n = i + 1; });
          for (const p of all) if (p.img) {
            const im = await pic(p.img);
            let clean = !!im;
            if (im && !p.img.startsWith("/")) { try { const t = document.createElement("canvas"); t.width = t.height = 2; const tc = t.getContext("2d"); tc.drawImage(im, 0, 0, 2, 2); tc.getImageData(0, 0, 1, 1); } catch (e) { clean = false; } }
            p.imgEl = clean ? im : null;
          }
          for (const p of all) {
            const row = document.createElement("div"); row.className = "row";
            const cv = document.createElement("canvas"); draw(cv, p, set);
            const b = document.createElement("button"); b.textContent = "Save as PNG"; b.onclick = () => save(cv, p.title || "panel");
            row.append(cv, b); list.append(row); made.push([cv, p.title || "panel"]);
          }
          if (/[?&]save=1/.test(location.search) && !poll.saved) { poll.saved = true; made.forEach(([cv, n], i) => setTimeout(() => save(cv, n), i * 400)); }
        }
      }
    } catch (e) {}
    setTimeout(poll, 2000);
  }
  $("all").onclick = () => made.forEach(([cv, n], i) => setTimeout(() => save(cv, n), i * 400));
  poll();
</script>
</body>
