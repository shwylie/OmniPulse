<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Your channel panels, made in the Stream Suite (Settings > Streaming > Suite > Creators > Panels): each one
  drawn here at Twitch's panel size (320 wide, at twice that for sharpness), in one theme, with Save as PNG for
  each and for all of them. Upload them on Twitch (your channel, About, Edit Panels) or Kick. /panels; it reads
  /now.json's suite.creators.
-->
<title>OmniPulse Panels</title>
<style>

  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lede { margin: 0 0 22px; color: #a9a5ba; font-size: 14px; }
  .row { display: flex; align-items: center; gap: 16px; margin: 0 0 14px; }
  canvas { width: 320px; border-radius: 6px; background: repeating-conic-gradient(#2a2733 0 25%, #221f2b 0 50%) 0 0 / 16px 16px; }
  button { font: 600 13px "Segoe UI", sans-serif; color: #fff; background: #3a3550; border: 1px solid #555070; border-radius: 9px; padding: 8px 14px; cursor: pointer; }
  button:hover { background: #4a4466; }
  button.all { background: linear-gradient(135deg, #8e9bff, #ff7ac8); border: 0; margin-bottom: 22px; }
  .name { color: #a9a5ba; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Your panels</h1>
  <p class="lede">Save each one as a picture, then add it on Twitch (your channel, About, then Edit Panels) or Kick. Change them in OmniPulse: Settings &gt; Streaming &gt; Suite &gt; Creators &gt; Panels.</p>
  <button class="all" id="all">Save them all</button>
  <div id="list"></div>
</main>

  // (its icon's tile: in its colours, as its theme draws them)

  // (its title: in its glow or outline; Terminal's with its prompt and cursor)

    const t = (th === "terminal" ? "> " : "") + (UPPER.has(th) ? text.toUpperCase() : text);

  }
  const titleText = (th, t) => (th === "terminal" ? "> " : "") + (UPPER.has(th) ? t.toUpperCase() : t) + (th === "terminal" ? "__" : "");

  // One panel: its title (and line under it), in the set's theme and shape; extended, its words under the title
  function draw(cv, p, set) {

  let sig = "", made = [];
