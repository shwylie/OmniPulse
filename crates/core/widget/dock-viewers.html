<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniPulse Viewer List</title>
<style>
  /* OmniPulse's Viewer List dock, for OBS (Docks > Custom Browser Docks): who's in your Twitch chat (Twitch's own
     list), and who's chatted on Kick and YouTube this stream, by role, each a time-out or ban a click away */
  :root {
    --bg: #1b1d24; --panel: #23262f; --line: #2e323d; --text: #e6e8ee; --dim: #8b91a1; --accent: #7aa2ff;
    --twitch: #a970ff; --kick: #53fc18; --youtube: #ff3b3b; --danger: #ff5c6c; --fs: 13px; --accent2: #c08bff; --pad: 1;
  }
  * { box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: var(--dim) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 4px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: var(--fs) / 1.4 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  header { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
  .top { display: flex; flex-direction: column; gap: 2px; }
  .top h1 { margin: 0; font-size: 13px; font-weight: 600; }
  .sum { color: var(--dim); font-size: 11px; display: flex; gap: 4px 12px; flex-wrap: wrap; }
  .sum:empty { display: none; }
  .sum span { display: inline-flex; align-items: center; gap: 4px; }
  .sum svg { width: 11px; height: 11px; }
  input[type=search] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
  input[type=search]:focus { outline: none; border-color: var(--accent); }
  .from { display: flex; gap: 5px; flex-wrap: wrap; }
  .from button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 1px 10px; color: var(--dim); cursor: pointer; font-size: 12px; }
  .from button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .from button:empty { display: none; }
  main { flex: 1; overflow-y: auto; padding: 4px 6px 10px; }
  .note { color: var(--dim); font-size: 11px; padding: 6px 4px; }
  .note:empty { display: none; }
  /* each role's group: its name and how many, clicked shut or open */
  .grp > h2 { position: sticky; top: 0; z-index: 1; margin: 0; padding: 6px 4px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); font-weight: 600; background: var(--bg); cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; }
  .grp > h2::before { content: "\25BE"; font-size: 10px; transition: transform 0.15s; }
  .grp.shut > h2::before { transform: rotate(-90deg); }
  .grp.shut > .list { display: none; }
  .grp > h2 b { color: var(--text); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 7px; padding: calc(3px * var(--pad)) 4px; border-radius: 6px; min-height: calc(18px + 8px * var(--pad)); }
  .row:hover { background: var(--panel); }
  .row svg.p { width: 12px; height: 12px; flex: none; }
  .row .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .row .ago { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .row .on { width: 6px; height: 6px; border-radius: 3px; background: #4ad295; flex: none; }
  .row .acts { margin-left: auto; display: flex; gap: 2px; opacity: 0; }
  .row:hover .acts, .row .acts:focus-within { opacity: 1; }
  .acts button { border: 0; background: transparent; color: var(--dim); width: 24px; height: 22px; border-radius: 5px; cursor: pointer; display: grid; place-items: center; }
  .acts button:hover { color: var(--text); background: var(--line); }
  .acts button svg { width: 14px; height: 14px; fill: currentColor; }
  .acts button.arm { color: #fff; background: var(--danger); }
  .more { color: var(--dim); font-size: 11px; padding: 4px; }
  .said { position: fixed; left: 8px; right: 8px; bottom: 8px; background: #000d; color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 8px; display: none; }
  .said.show { display: block; }
  /* spacing */
  body.d-compact { --pad: 0.6; } body.d-roomy { --pad: 1.6; }
  /* ---------- Designs: the Chat Dock's five, on this dock (it follows the Chat Dock's unless told not to) ---------- */
  :root { --grad: linear-gradient(120deg, var(--accent2), var(--accent)); --band: #ffffff0b; }
  body.light { --band: #0000000d; }
  select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--text); padding: 1px 4px; }
  select option { background: var(--bg); color: var(--text); }
  select:focus { outline: none; border-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  /* Glass: soft colour behind, its panels see-through, pills and a gradient title */
  body.st-glass { background: radial-gradient(90% 60% at 0% 0%, color-mix(in srgb, var(--accent2) 22%, transparent), transparent 70%), radial-gradient(90% 60% at 100% 100%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%), var(--bg); }
  body.st-glass header, body.st-glass #settings { background: color-mix(in srgb, var(--panel) 70%, transparent); border-color: #ffffff1c; }
  body.st-glass header h1 { font-size: 15px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  body.st-glass input[type=text], body.st-glass input[type=search], body.st-glass select { border-radius: 999px; background: color-mix(in srgb, var(--bg) 70%, transparent); border-color: #ffffff26; padding-left: 12px; }
  body.st-glass .row { border-radius: 10px; background: color-mix(in srgb, var(--panel) 55%, transparent); margin-bottom: 2px; }
  body.st-glass .row:nth-child(even) { background: color-mix(in srgb, var(--panel) 88%, transparent); box-shadow: inset 0 0 0 1px #ffffff12; }
  body.st-glass .row:hover { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent); }
  /* Bubbles: each band a speech bubble in its platform's colour */
  body.st-bubbles { background: radial-gradient(120% 70% at 0% 0%, color-mix(in srgb, var(--accent) 16%, var(--bg)), var(--bg) 62%); }
  body.st-bubbles header { background: none; border: 0; padding: 10px 12px; }
  body.st-bubbles header h1 { font-size: 15px; font-weight: 700; }
  body.st-bubbles #settings { background: none; border: 0; }
  body.st-bubbles input[type=text], body.st-bubbles input[type=search], body.st-bubbles select { border-radius: 999px; background: var(--panel); padding-left: 12px; }
  body.st-bubbles .row { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 4px 14px 14px 14px; background: var(--panel); margin: 0 10px 6px 8px; max-width: calc(100% - 18px); }
  body.st-bubbles .row:nth-child(even) { background: color-mix(in srgb, var(--panel) 80%, var(--text) 7%); }
  /* Neon: a terminal lit in your accent, in a monospace face */
  body.st-neon { background: #010402; font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; box-shadow: inset 0 0 0 1px var(--accent), inset 0 0 30px color-mix(in srgb, var(--accent) 12%, transparent); }
  body.st-neon.light { background: #f6fff9; }
  body.st-neon header, body.st-neon #settings { background: none; border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  body.st-neon header h1 { color: var(--accent); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700; text-shadow: 0 0 8px var(--accent); }
  body.st-neon header h1::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: var(--accent2); box-shadow: 0 0 10px var(--accent2); }
  body.st-neon h2 { color: var(--accent); text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent); letter-spacing: 0.12em; }
  body.st-neon input[type=text], body.st-neon input[type=search], body.st-neon select, body.st-neon button { border-radius: 3px; }
  body.st-neon input[type=text], body.st-neon input[type=search], body.st-neon select { background: color-mix(in srgb, var(--accent) 6%, #010402); border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--text); }
  body.st-neon select option { background: #010402; }
  body.st-neon.light input[type=text], body.st-neon.light input[type=search], body.st-neon.light select { background: color-mix(in srgb, var(--accent) 6%, #f6fff9); } body.st-neon.light select option { background: #f6fff9; }
  body.st-neon input:focus, body.st-neon select:focus { box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent); }
  body.st-neon .row { border-left: 2px solid var(--accent); border-radius: 0 6px 6px 0; background: #ffffff08; box-shadow: -6px 0 12px -8px var(--accent); margin-bottom: 4px; }
  body.st-neon .row:nth-child(even) { background: #ffffff14; }
  body.st-neon.light .row { background: #0000000a; } body.st-neon.light .row:nth-child(even) { background: #00000014; }
  body.st-neon .note, body.st-neon .count, body.st-neon .meta, body.st-neon .ago, body.st-neon .sum { color: color-mix(in srgb, var(--accent) 60%, var(--dim)); }
  /* Ribbon: each band a ribbon in its platform's colour, under a gradient rule */
  body.st-ribbon { background: var(--panel); }
  body.st-ribbon header { background: var(--bg); border-bottom: 2px solid transparent; border-image: var(--grad) 1; }
  body.st-ribbon header h1 { font-size: 15px; font-weight: 800; }
  body.st-ribbon #settings { background: var(--bg); }
  body.st-ribbon input[type=text], body.st-ribbon input[type=search], body.st-ribbon select { background: var(--bg); }
  body.st-ribbon .row { border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 40%, transparent) -60%, var(--bg) 36%); margin-bottom: 3px; }
  body.st-ribbon .row:nth-child(even) { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 40%, transparent) -60%, color-mix(in srgb, var(--bg) 70%, var(--text) 9%) 36%); }
  /* Cards: a heading in your accent, each band a card */
  body.st-cards header { border-bottom: 2px solid var(--accent); }
  body.st-cards .row { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; margin-bottom: 4px; }
  body.st-glass .row, body.st-cards .row, body.st-neon .row, body.st-ribbon .row, body.st-bubbles .row { padding-left: 8px; padding-right: 6px; }
  body.st-glass .grp > h2 { background: transparent; backdrop-filter: blur(6px); }
  body.st-bubbles .grp > h2, body.st-neon .grp > h2, body.st-ribbon .grp > h2 { background: transparent; }
  body.st-ribbon .grp > h2 { background: var(--panel); }
  body.st-cards .grp > h2 { color: var(--text); }
  body.st-cards .row.live, body.st-neon .row.live { border-left-color: #4ad295; }
  body.st-neon .row .n { text-shadow: 0 0 8px currentColor; }
  body.st-glass .from button, body.st-bubbles .from button { background: #ffffff0e; color: var(--text); }
  body.st-glass .from button[aria-pressed="true"], body.st-bubbles .from button[aria-pressed="true"] { background: var(--grad); border-color: transparent; color: #111; font-weight: 700; }
  body.st-neon .from button { border-radius: 3px; border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--text); background: none; }
  body.st-neon .from button[aria-pressed="true"] { background: var(--accent); color: #011; font-weight: 700; box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent); }
  body.st-ribbon .from button { background: var(--bg); color: var(--text); }
  /* what it shows */
  body.no-marks .row svg.p, body.no-ago .row .ago, body.no-dot .row .on, body.no-counts .sum, body.no-search #q { display: none; }
  body.acts-on .row .acts { opacity: 1; }
  body.light .row .on { background: #17965f; }
  body.sq *, body.sq *::after { border-radius: 0 !important; }
  #tip { position: fixed; left: 0; top: 0; display: none; max-width: calc(100vw - 8px); box-sizing: border-box; background: #000c; color: #fff; font-size: 11px; line-height: 1.35; padding: 4px 8px; border-radius: 6px; pointer-events: none; z-index: 1000; overflow-wrap: anywhere; }
  #tip.show { display: block; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>Viewers</h1><div class="sum" id="sum"></div></div>
  <input type="search" id="q" placeholder="Find someone" autocomplete="off">
  <div class="from" id="from"></div>
</header>
<main id="main">
  <div class="note" id="note"></div>
  <div id="groups"></div>
</main>
<div class="said" id="said"></div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MARK = {
    twitch: "M4.3 2 3 5.4v13.8h4.7V22h2.7l2.6-2.8h3.8l5.2-5.3V2zm16 11-2.9 3h-4.7l-2.6 2.6V16H6.3V3.7h14zm-2.9-6v5.3h-1.8V7zm-4.8 0v5.3h-1.8V7z",
    kick: "M3 2h6v6h2V5h2V2h8v8h-2v2h-2v2h2v2h2v6h-8v-3h-2v-3H9v6H3z",
    youtube: "M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8zM10 15V9l5.2 3z",
  };
  const NAMES = { twitch: "Twitch", kick: "Kick", youtube: "YouTube" };
  const ROLES = [["broadcaster", "You"], ["moderator", "Moderators"], ["vip", "VIPs"], ["subscriber", "Subscribers"], ["viewer", "Viewers"]];
  const SHOWN = 400;
  const ROLE_ON = { moderator: "mods", vip: "vips", subscriber: "subs", viewer: "viewers" };
  // (?preview=1: its settings page's preview in OmniPulse: it follows the page as it's changed, shows made-up
  // viewers if there's nothing real yet, and its buttons do nothing)
  const PV = /[?&]preview=1/.test(location.search);
  // (its settings, kept by OmniPulse on its page in Settings > Streaming > Suite > Docks: these follow them)
  const DEF = { mods: true, vips: true, subs: true, viewers: true, counts: true, search: true, marks: true, colors: true, ago: true, dot: true, sort: "active", size: "13", secs: "600", hover: true, look: "app", style: "plain", accent: "app", font: "app", corners: "app", density: "normal" };
  let opt = Object.assign({}, DEF), appTheme = null, fontOn = "", setN = -1;
  const CLASSIC = { bg: "#1b1d24", panel: "#23262f", line: "#2e323d", text: "#e6e8ee", muted: "#8b91a1", accent: "#7aa2ff", accent2: "#c08bff", light: false, rounded: true, font: "" };
  const PALS = { sunset: ["#ff8a5c", "#ff5c8a"], ocean: ["#3ec7ff", "#5c7cff"], candy: ["#ff8fd8", "#a78bff"], mint: ["#5ef2b8", "#3ec7ff"], fire: ["#ffb03a", "#ff5c3a"], gold: ["#ffd76e", "#ffa53a"], mono: ["#f2f2f2", "#a8a8a8"] };
  function applyLook() {
    const t = opt.look === "classic" || !appTheme ? CLASSIC : appTheme, r = document.documentElement.style, pal = PALS[opt.accent];
    r.setProperty("--bg", t.bg); r.setProperty("--panel", t.panel); r.setProperty("--line", t.line); r.setProperty("--text", t.text); r.setProperty("--dim", t.muted);
    r.setProperty("--accent", pal ? pal[0] : t.accent); r.setProperty("--accent2", pal ? pal[1] : t.accent2 || t.accent);
    r.setProperty("--fs", (Number(opt.size) || 13) + "px");
    const c = document.body.classList;
    c.toggle("light", !!t.light);
    c.toggle("sq", opt.corners === "square" || (opt.corners !== "rounded" && !t.rounded));
    ["compact", "roomy"].forEach((d) => c.toggle("d-" + d, opt.density === d));
    ["glass", "cards", "neon", "bubbles", "ribbon"].forEach((s) => c.toggle("st-" + s, opt.style === s));
    // (the theme's font: from Google Fonts, as OBS won't have it; Neon keeps its own face)
    const f = opt.font === "theme" && opt.style !== "neon" ? t.font || "" : "";
    if (f && f !== fontOn) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(f).replace(/%20/g, "+") + ":wght@400;600;700&display=swap"; document.head.append(l); }
    fontOn = f;
    document.body.style.fontFamily = f ? '"' + f + '", "Segoe UI", system-ui, sans-serif' : "";
    shows();
  }
  async function look() {
    try {
      const j = await (await fetch("/dock/settings.json?page=viewers" + (PV ? "&preview=1" : ""), { cache: "no-store" })).json();
      const themed = JSON.stringify(j.theme || null) !== JSON.stringify(appTheme);
      if (themed) appTheme = j.theme || null;
      if (j.n !== setN) { setN = j.n; opt = Object.assign({}, DEF, j.opt && typeof j.opt === "object" ? j.opt : {}); applyLook(); redraw(); }
      else if (themed) applyLook();
    } catch (e) {}
    setTimeout(look, PV ? 500 : 3000);
  }
  function shows() {
    const c = document.body.classList;
    c.toggle("no-marks", !opt.marks); c.toggle("no-ago", !opt.ago); c.toggle("no-dot", !opt.dot); c.toggle("no-counts", !opt.counts); c.toggle("no-search", !opt.search); c.toggle("acts-on", !opt.hover);
    if (!opt.search && $("q").value) $("q").value = "";
  }
  const redraw = () => draw(true);
  // (the preview's made-up viewers, while no one real is listed)
  const SAMPLE = { at: 1, platforms: { twitch: { on: true, inChat: 9, full: true }, kick: { on: true, watching: 14, chatted: 2 } }, rows: [
    ["twitch", "YourChannel", "broadcaster", "#ffb03a", 1], ["twitch", "NightOwl", "moderator", "#5ef2b8", 2], ["kick", "ModMaya", "moderator", "#ff8fd8", 0],
    ["twitch", "PixelPete", "vip", "#3ec7ff", 4], ["twitch", "luna_plays", "subscriber", "#c08bff", 1], ["twitch", "DriftKing", "subscriber", "#ff8a5c", 38],
    ["twitch", "sam_the_viewer", "viewer", "", 3], ["kick", "kickfan22", "viewer", "#53fc18", 0], ["twitch", "quietlurker", "viewer", "", 0], ["twitch", "ella_b", "viewer", "#ffd76e", 12],
  ].map(([p, name, role, color, mins]) => ({ p, name, login: name.toLowerCase(), role, color, at: mins ? Date.now() - mins * 60000 : 0 })) };
  const secsText = () => ({ 60: "1 minute", 300: "5 minutes", 600: "10 minutes", 3600: "1 hour", 86400: "1 day" })[Number(opt.secs)] || "10 minutes";
  const NS = "http://www.w3.org/2000/svg";
  const mark = (p) => { const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.classList.add("p"); s.style.fill = "var(--" + p + ")"; const x = document.createElementNS(NS, "path"); x.setAttribute("d", MARK[p] || MARK.twitch); s.append(x); return s; };
  const act = (cmd) => PV ? Promise.resolve({ ok: false, error: "This is a preview. The dock in OBS does it for real." }) : fetch("/dock/do", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cmd) }).then((r) => r.json()).catch(() => ({ ok: false, error: "OmniPulse isn't answering (is it open, with the Stream Suite on?)" }));
  let data = { rows: [], platforms: {}, at: 0 }, from = "all", drawnAt = -1, drawnKey = "";
  const shut = new Set();
  try { for (const k of JSON.parse(localStorage.getItem("viewersShut") || "[]")) shut.add(k); } catch (e) {}
  let saidOff = null;
  const say = (t) => { const s = $("said"); s.textContent = t; s.classList.add("show"); clearTimeout(saidOff); saidOff = setTimeout(() => s.classList.remove("show"), 4000); };
  const ago = (t) => { if (!t) return ""; const s = Math.max(0, (Date.now() - t) / 1000); return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + "m ago" : Math.floor(s / 3600) + "h ago"; };
  const ICON = {
    timeout: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.5-13H11v6l5.2 3.2.8-1.2-4.5-2.7z",
    ban: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM4 12a8 8 0 0 1 12.9-6.3L5.7 16.9A7.9 7.9 0 0 1 4 12zm8 8a7.9 7.9 0 0 1-4.9-1.7L18.3 7.1A8 8 0 0 1 12 20z",
  };
  function btn(kind, tip, onClick) {
    const b = document.createElement("button"); b.type = "button"; b.dataset.tip = tip;
    const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 24 24"); const x = document.createElementNS(NS, "path"); x.setAttribute("d", ICON[kind]); s.append(x); b.append(s);
    b.onclick = (e) => { e.stopPropagation(); onClick(b); };
    return b;
  }
  function row(r) {
    const d = document.createElement("div"); d.className = "row" + (r.at && Date.now() - r.at < 10 * 60000 ? " live" : "");
    d.append(mark(r.p));
    const n = document.createElement("span"); n.className = "n"; n.textContent = r.name; if (opt.colors && /^#[0-9a-f]{6}$/i.test(r.color || "")) n.style.color = r.color; d.append(n);
    // (chatted in the last ten minutes: a green dot; when they last did)
    if (r.at && Date.now() - r.at < 10 * 60000) { const o = document.createElement("span"); o.className = "on"; o.dataset.tip = "Chatting now"; d.append(o); }
    if (r.at) { const a = document.createElement("span"); a.className = "ago"; a.textContent = ago(r.at); d.append(a); }
    // (a time-out and a ban: Twitch's and Kick's; you and YouTube's chatters have none here)
    if (r.role !== "broadcaster" && r.p !== "youtube") {
      const acts = document.createElement("span"); acts.className = "acts";
      const who = { platform: r.p, user: r.name, login: r.login, userId: r.userId };
      acts.append(btn("timeout", "Time out for " + secsText(), async () => { const x = await act(Object.assign({ do: "timeout", seconds: Number(opt.secs) || 600 }, who)); say(x.ok === false ? x.error || "Couldn't." : "Timing out " + r.name + " for " + secsText() + "."); }));
      acts.append(btn("ban", "Ban", async (b) => {
        if (!b.classList.contains("arm")) { b.classList.add("arm"); b.dataset.tip = "Click again to ban " + r.name; setTimeout(() => { b.classList.remove("arm"); b.dataset.tip = "Ban"; }, 3000); return; }
        const x = await act(Object.assign({ do: "ban" }, who)); say(x.ok === false ? x.error || "Couldn't." : "Banning " + r.name + ".");
      }));
      d.append(acts);
    }
    return d;
  }
  function draw(force) {
    const q = $("q").value.trim().toLowerCase();
    // (the preview, with no one real to list: made-up viewers, so the look can be seen)
    const D = PV && !(data.rows || []).length ? SAMPLE : data;
    const key = D.at + "|" + q + "|" + from + "|" + Array.from(shut).join(",");
    if (!force && key === drawnKey) return;
    drawnKey = key;
    // (how many on each)
    const pf = D.platforms || {}, sum = $("sum");
    sum.textContent = "";
    const part = (p, text) => { const s = document.createElement("span"); s.append(mark(p), document.createTextNode(text)); sum.append(s); };
    if (pf.twitch && pf.twitch.on) part("twitch", (pf.twitch.inChat || 0) + (pf.twitch.full ? " in chat" : " chatted"));
    if (pf.kick && pf.kick.on) part("kick", (pf.kick.watching != null ? pf.kick.watching + " watching, " : "") + (pf.kick.chatted || 0) + " chatted");
    if (pf.youtube && pf.youtube.on) part("youtube", (pf.youtube.chatted || 0) + " chatted");
    // (the platforms to pick from: those on)
    const on = Object.keys(NAMES).filter((p) => pf[p] && pf[p].on);
    const fb = $("from");
    fb.textContent = "";
    if (on.length > 1) for (const p of ["all"].concat(on)) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = p === "all" ? "All" : NAMES[p]; b.setAttribute("aria-pressed", String(from === p));
      b.onclick = () => { from = p; draw(true); }; fb.append(b);
    }
    if (from !== "all" && !on.includes(from)) from = "all";
    $("note").textContent = !D.at ? "Waiting for the chatbot. It needs to be on (Settings > Streaming > Suite), signed in to Twitch or Kick." : (pf.twitch && pf.twitch.note) || "";
    const rows = (D.rows || []).filter((r) => (from === "all" || r.p === from) && (!q || String(r.name).toLowerCase().includes(q) || String(r.login).includes(q)));
    const box = $("groups");
    box.textContent = "";
    for (const [role, title] of ROLES) {
      if (ROLE_ON[role] && !opt[ROLE_ON[role]]) continue;
      const now = (r) => (opt.sort === "active" && r.at && Date.now() - r.at < 600000 ? 1 : 0);
      const list = rows.filter((r) => (r.role || "viewer") === role).sort((a, b) => now(b) - now(a) || String(a.name).localeCompare(String(b.name)));
      if (!list.length) continue;
      const g = document.createElement("section"); g.className = "grp" + (shut.has(role) ? " shut" : "");
      const h = document.createElement("h2"); h.append(document.createTextNode(title + " "), Object.assign(document.createElement("b"), { textContent: String(list.length) }));
      h.onclick = () => { if (shut.has(role)) shut.delete(role); else shut.add(role); try { localStorage.setItem("viewersShut", JSON.stringify(Array.from(shut))); } catch (e) {} draw(true); };
      const l = document.createElement("div"); l.className = "list";
      for (const r of list.slice(0, SHOWN)) l.append(row(r));
      if (list.length > SHOWN) { const m = document.createElement("div"); m.className = "more"; m.textContent = "And " + (list.length - SHOWN) + " more. Search to find someone."; l.append(m); }
      g.append(h, l);
      box.append(g);
    }
    if (D.at && !rows.length) { const m = document.createElement("div"); m.className = "note"; m.textContent = q ? "No one by that name." : "No one yet. Chatters show here as they chat."; box.append(m); }
  }
  $("q").oninput = () => draw();
  async function poll() {
    try {
      const j = await (await fetch("/dock/viewers.json", { cache: "no-store" })).json();
      if (j && j.at !== drawnAt) { data = j; drawnAt = j.at; }
    } catch (e) {}
    draw();
    setTimeout(poll, 4000);
  }
  // (the "ago"s kept true, a minute at a time)
  setInterval(() => draw(true), 60000);
  look();
  poll();
})();
</script>
<div id="tip" role="tooltip"></div>
<script>
  // ---------- the tip on hover: below what it's for, or above it if there's no room, kept inside the dock ----------
  (() => {
    const tip = document.getElementById("tip");
    let on = null;
    const place = () => {
      if (!on || !on.isConnected || !on.dataset.tip) { tip.classList.remove("show"); on = null; return; }
      if (tip.textContent !== on.dataset.tip) tip.textContent = on.dataset.tip;
      tip.classList.add("show");
      const r = on.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight, gap = 6, edge = 4;
      let y = r.bottom + gap;
      if (y + h > innerHeight - edge) y = r.top - gap - h;
      y = Math.min(Math.max(edge, y), innerHeight - h - edge);
      const x = Math.min(Math.max(edge, r.right - w), innerWidth - w - edge);
      tip.style.left = Math.max(edge, x) + "px"; tip.style.top = Math.max(edge, y) + "px";
    };
    document.addEventListener("mouseover", (e) => {
      const t = e.target.closest ? e.target.closest("[data-tip]") : null;
      const next = t && t.dataset.tip ? t : null;
      if (next !== on) { on = next; place(); }
    });
    document.addEventListener("mouseout", (e) => { if (on && !on.contains(e.relatedTarget)) { on = null; place(); } });
    addEventListener("scroll", () => { if (on) place(); }, true);
    addEventListener("blur", () => { on = null; place(); });
    new MutationObserver((ms) => { if (on && ms.some((m) => m.target !== tip && !tip.contains(m.target))) place(); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-tip"] });
  })();
</script>
