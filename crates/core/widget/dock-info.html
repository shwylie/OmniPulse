<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniPulse Stream Info</title>
<style>
  /* OmniPulse's Stream Info dock, for OBS (Docks > Custom Browser Docks): your title and category on Twitch
     and Kick, read from them, and changed on both at once */
  :root {
    --bg: #1b1d24; --panel: #23262f; --line: #2e323d; --text: #e6e8ee; --dim: #8b91a1; --accent: #7aa2ff;
    --twitch: #a970ff; --kick: #53fc18; --danger: #ff5c6c; --fs: 13px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: var(--fs) / 1.4 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
  header h1 { margin: 0 auto 0 2px; font-size: 13px; font-weight: 600; }
  .icon { border: 0; background: transparent; color: var(--dim); padding: 2px 6px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .icon:hover { color: var(--text); background: var(--line); }
  main { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
  label.f { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 12px; }
  input[type=text] { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  .count { align-self: flex-end; font-size: 11px; color: var(--dim); }
  /* where it goes: Twitch, Kick */
  .to { display: flex; gap: 6px; flex-wrap: wrap; }
  .to button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 12px; color: var(--dim); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .to button svg { width: 13px; height: 13px; fill: currentColor; }
  .to button[aria-pressed="true"].twitch { color: var(--twitch); border-color: var(--twitch); }
  .to button[aria-pressed="true"].kick { color: var(--kick); border-color: var(--kick); }
  body.light .to button[aria-pressed="true"].kick { color: #2f9e0a; border-color: #2f9e0a; }
  .to button:disabled { opacity: 0.4; cursor: default; }
  /* categories found as it's typed */
  .found { display: flex; flex-direction: column; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
  .found:empty { display: none; }
  .found button { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 4px 6px; border-radius: 6px; text-align: left; cursor: pointer; }
  .found button:hover { background: var(--line); }
  .found img { width: 26px; height: 36px; border-radius: 3px; object-fit: cover; background: var(--line); }
  .go { border: 0; border-radius: 8px; padding: 8px 12px; background: var(--accent); color: #111; font-weight: 700; cursor: pointer; }
  .go:disabled { opacity: 0.5; cursor: default; }
  .said { font-size: 12px; color: var(--dim); min-height: 1em; }
  /* as they are now, on each */
  .now { display: flex; flex-direction: column; gap: 6px; }
  .now h2 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--line)); border-radius: 8px; padding: 7px 9px; display: flex; flex-direction: column; gap: 2px; }
  .card b { font-size: 12px; }
  .card span { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  .note { color: var(--dim); font-size: 11px; }
  body.sq *, body.sq *::after { border-radius: 0 !important; }
</style>
</head>
<body>
<header>
  <h1>Stream Info</h1>
  <button class="icon" id="again" type="button" title="Read them again from Twitch and Kick">&#x21bb;</button>
</header>
<main>
  <label class="f">Title <input type="text" id="title" maxlength="140" placeholder="Your stream's title" autocomplete="off"><span class="count" id="count">0 / 140</span></label>
  <label class="f">Category <input type="text" id="cat" placeholder="Search for a game or category" autocomplete="off"></label>
  <div class="found" id="found"></div>
  <div class="to">
    <button class="twitch" id="toTwitch" type="button" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4.3 2 3 5.4v13.8h4.7V22h2.7l2.6-2.8h3.8l5.2-5.3V2zm16 11-2.9 3h-4.7l-2.6 2.6V16H6.3V3.7h14zm-2.9-6v5.3h-1.8V7zm-4.8 0v5.3h-1.8V7z"/></svg>Twitch</button>
    <button class="kick" id="toKick" type="button" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 2h6v6h2V5h2V2h8v8h-2v2h-2v2h2v2h2v6h-8v-3h-2v-3H9v6H3z"/></svg>Kick</button>
  </div>
  <button class="go" id="go" type="button">Update</button>
  <div class="said" id="said"></div>
  <div class="now">
    <h2>Now</h2>
    <div class="card" id="nowTwitch" style="--c: var(--twitch)"><b>Twitch</b><span id="nowTwitchT">Reading...</span></div>
    <div class="card" id="nowKick" style="--c: var(--kick)"><b>Kick</b><span id="nowKickT">Reading...</span></div>
  </div>
  <p class="note">Leave the title or the category empty to keep it as it is. Twitch and Kick don't let other apps change go-live notifications, and YouTube's title is changed in YouTube Studio.</p>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const act = (cmd) => fetch("/dock/do", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cmd) }).then((r) => r.json()).catch(() => ({ ok: false, error: "OmniPulse isn't answering (is it open, with the Stream Suite on?)" }));
  const to = { twitch: true, kick: true };
  let can = { twitch: false, kick: false }, lastAt = -1, lastQ = "", lastSaid = "", filled = false;
  const pressed = () => { $("toTwitch").setAttribute("aria-pressed", String(to.twitch && can.twitch)); $("toKick").setAttribute("aria-pressed", String(to.kick && can.kick)); $("toTwitch").disabled = !can.twitch; $("toKick").disabled = !can.kick; };
  $("toTwitch").onclick = () => { to.twitch = !to.twitch; pressed(); };
  $("toKick").onclick = () => { to.kick = !to.kick; pressed(); };
  $("title").oninput = () => { $("count").textContent = $("title").value.length + " / 140"; };
  // (categories found as it's typed, a moment after you stop)
  let wait = null;
  $("cat").oninput = () => { clearTimeout(wait); const q = $("cat").value.trim(); if (!q) { $("found").textContent = ""; return; } wait = setTimeout(() => act({ do: "catsearch", q }), 350); };
  $("go").onclick = async () => {
    $("go").disabled = true; $("said").textContent = "Updating...";
    const r = await act({ do: "setinfo", title: $("title").value, category: $("cat").value, twitch: to.twitch && can.twitch, kick: to.kick && can.kick });
    if (!r.ok) $("said").textContent = r.error || "Couldn't.";
    setTimeout(() => { $("go").disabled = false; }, 1500);
  };
  $("again").onclick = () => act({ do: "info" });
  function draw(info) {
    can = { twitch: !!info.canTwitch, kick: !!info.canKick };
    pressed();
    const line = (x, ok) => !ok ? "Not signed in (Settings > Streaming > Suite)." : !x ? "Couldn't read it." : (x.title || "(no title)") + " · " + (x.category || "no category");
    $("nowTwitchT").textContent = line(info.twitch, can.twitch);
    $("nowKickT").textContent = line(info.kick, can.kick);
    // (the boxes filled from what's there, the first time, so a small change is easy)
    if (!filled && (info.twitch || info.kick)) {
      const x = info.twitch || info.kick;
      if (!$("title").value) $("title").value = x.title || "";
      if (!$("cat").value) $("cat").value = x.category || "";
      $("title").oninput();
      filled = true;
    }
    if (info.said && info.said !== lastSaid) { lastSaid = info.said; $("said").textContent = info.said; }
    const f = info.found || { q: "", list: [] };
    if (f.q !== lastQ && f.q === $("cat").value.trim()) {
      lastQ = f.q;
      const box = $("found"); box.textContent = "";
      for (const c of f.list || []) {
        const b = document.createElement("button"); b.type = "button";
        if (/^https:\/\//.test(c.art || "")) { const i = document.createElement("img"); i.src = c.art; i.alt = ""; b.append(i); }
        b.append(document.createTextNode(c.name));
        b.onclick = () => { $("cat").value = c.name; box.textContent = ""; };
        box.append(b);
      }
    }
  }
  async function poll() {
    try {
      const s = await (await fetch("/now.json", { cache: "no-store" })).json();
      const info = s.suite && s.suite.info;
      if (info) draw(info);
    } catch (e) {}
    setTimeout(poll, 800);
  }
  // (the app theme's look, as the other docks follow it)
  async function look() {
    try {
      const j = await (await fetch("/dock/settings.json?page=info", { cache: "no-store" })).json();
      const t = j.theme;
      if (t) {
        const r = document.documentElement.style;
        r.setProperty("--bg", t.bg); r.setProperty("--panel", t.panel); r.setProperty("--line", t.line); r.setProperty("--text", t.text); r.setProperty("--dim", t.muted); r.setProperty("--accent", t.accent);
        document.body.classList.toggle("light", !!t.light);
        document.body.classList.toggle("sq", !t.rounded);
      }
    } catch (e) {}
    setTimeout(look, 5000);
  }
  look();
  act({ do: "info" });
  poll();
})();
</script>
</body>
</html>
