<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniPulse Multichat Overlay</title>
<style>
  /* OmniPulse's multichat, on stream (an OBS Browser source): Twitch and Kick chat together, see-through.
     Its settings: the gear (in OBS, right-click the source, Interact), kept for it; or in its address
     (?size=20&fade=30&from=kick...), which wins */
  :root { --fs: 20px; --bg: 0; --gap: 6px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 600 var(--fs) / 1.35 "Segoe UI", system-ui, sans-serif; color: #fff; }
  #list { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: var(--gap); padding: 12px; }
  body.top #list { justify-content: flex-start; flex-direction: column-reverse; }
  .m { flex-shrink: 0; display: flex; align-items: flex-start; gap: 8px; padding: 6px 10px; border-radius: 12px; background: rgba(10, 12, 18, var(--bg)); animation: in 0.35s ease-out; max-width: 100%; overflow-wrap: anywhere; }
  body.shadow .m { text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85), 0 0 2px rgba(0, 0, 0, 0.9); }
  /* its themes (Settings > Streaming > Suite > Widgets > Multichat Overlay, or the gear): Plain uses the
     Background as set; the rest bring their own */
  body.t-bubbles .m { background: rgba(10, 12, 18, max(var(--bg), 0.55)); border-left: 3px solid var(--pc, #9146ff); border-radius: 4px 12px 12px 4px; }
  body.t-glass .m { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  body.t-neon .m { background: rgba(6, 4, 18, 0.72); border: 1px solid var(--pc); border-radius: 12px; box-shadow: 0 0 10px var(--pc), inset 0 0 8px rgba(255, 255, 255, 0.05); }
  body.t-neon .who { text-shadow: 0 0 8px currentColor; }
  body.t-cards .m { background: #191c28; border-radius: 10px; border-top: 3px solid var(--pc); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45); }
  body.t-cards .m > div > .who { display: block; font-size: 0.8em; margin-bottom: 0.1em; }
  body.t-terminal, body.t-terminal .who { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; }
  body.t-terminal .m { background: rgba(0, 0, 0, 0.78); border-radius: 3px; color: #b6ffbe; border-left: 2px solid #3cff6e; }
  body.t-terminal .text { color: #b6ffbe; }
  body.t-comic .m { background: #fff; color: #111; border: 2px solid #111; border-radius: 18px 18px 18px 4px; box-shadow: 3px 3px 0 #111; text-shadow: none !important; }
  body.t-comic .text { color: #111; font-weight: 600; }
  body.t-comic .who { -webkit-text-stroke: 0.4px #111; }
  body.t-minimal .m { background: transparent; padding: 2px 4px; }
  body.t-minimal .m { text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.95); }
  body.t-minimal .who { font-size: 0.85em; }
  /* Edge Light: smoked glass, a stroke of light running round its edge in the platform's colour */
  @property --edge { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  body.t-edge .m { position: relative; background: rgba(12, 10, 24, 0.66); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  body.t-edge .m::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 2px; pointer-events: none;
    background: conic-gradient(from var(--edge), transparent 0 62%, var(--pc) 80%, #fff 86%, var(--pc) 90%, transparent 96%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: edge 3.6s linear infinite; }
  @keyframes edge { to { --edge: 360deg; } }
  /* Y2K Window: a little old-computer window, the name in its title bar */
  body.t-y2k .m { position: relative; flex-direction: column; gap: 0; padding: 0; background: #fdf6ff; color: #2b1b40; border: 2px solid #2b1b40; border-radius: 6px; box-shadow: 4px 4px 0 #2b1b40; text-shadow: none !important; overflow: hidden; }
  body.t-y2k .m > div { width: 100%; }
  body.t-y2k .m .who { display: flex; align-items: center; gap: 0.3em; padding: 0.12em 0.5em; background: linear-gradient(90deg, #ff9ad5, #b9a4ff 55%, #9ad0ff); border-bottom: 2px solid #2b1b40; font-size: 0.8em; color: #2b1b40 !important; }
  body.t-y2k .m .who::after { content: "\2013  \25A1  \00D7"; margin-left: auto; font-weight: 900; letter-spacing: 0.25em; }
  body.t-y2k .m .text { display: block; padding: 0.25em 0.55em 0.35em; color: #2b1b40; }
  body.t-y2k .pf { position: absolute; left: 0.45em; top: 0.18em; width: 0.8em; height: 0.8em; fill: #2b1b40; }
  body.t-y2k.marks .m .who { padding-left: 1.6em; }
  body.t-y2k .badge { margin: 0; vertical-align: 0; }
  /* Pastel: soft bubbles in each chatter's colour, the name a pill */
  body.t-pastel .m { background: color-mix(in srgb, var(--uc) 16%, #fffafc); color: #3a2a4a; border-radius: 18px; box-shadow: 0 3px 10px rgba(40, 20, 60, 0.25); text-shadow: none !important; }
  body.t-pastel .who { display: inline-block; padding: 0 0.5em; border-radius: 999px; background: color-mix(in srgb, var(--uc) 55%, #fff); color: #2a1a3a !important; font-size: 0.85em; margin-right: 0.3em; }
  body.t-pastel .text { color: #3a2a4a; }
  body.t-pastel .pf { fill: color-mix(in srgb, var(--pc) 70%, #3a2a4a); }
  /* Pixel: an old game's text box, square corners and a stepped edge */
  body.t-pixel, body.t-pixel .who { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; }
  body.t-pixel .m { background: #1b1030; border-radius: 0; margin: 4px; padding: 6px 10px; box-shadow: 0 -4px 0 0 #f4f0ff, 0 4px 0 0 #f4f0ff, -4px 0 0 0 #f4f0ff, 4px 0 0 0 #f4f0ff, 0 0 0 4px var(--pc) inset; }
  body.t-pixel .text { color: #f4f0ff; }
  /* Ribbon: made for In a Row. Each message a card in warm shifting colours, the name and badges over the
     words, a chat mark in its corner, little dots joining one to the next */
  body.t-ribbon .m { position: relative; padding: 8px 16px 9px 14px; border-radius: 12px; min-width: 150px; background: linear-gradient(105deg, var(--g1, #3a2a6a), var(--g2, #a86a3a)); border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45); }
  body.t-ribbon .m > div > .who { display: inline; }
  body.t-ribbon .m .text { display: block; margin-top: 2px; font-weight: 600; }
  body.t-ribbon .m .badge { margin: 0 0 0 0.35em; background: rgba(0, 0, 0, 0.35); color: #fff; border: 1px solid rgba(255, 255, 255, 0.25); }
  /* its corner mark (a chat bubble, a heart, a star, a note, the platform's own, or none) */
  .ci { display: none; }
  body.t-ribbon .ci { display: block; position: absolute; top: -8px; right: -7px; width: 1.25em; height: 1.25em; padding: 0.18em; border-radius: 0.35em; background: var(--ic, #ffd27a); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); }
  body.t-ribbon .ci svg { display: block; width: 100%; height: 100%; fill: rgba(20, 12, 30, 0.85); }
  body.t-ribbon.ri-none .ci { display: none; }
  /* its effects: a glow in its own colour; a slow shine across it */
  body.t-ribbon.r-glow .m { box-shadow: 0 0 18px color-mix(in srgb, var(--g2) 70%, transparent), 0 6px 16px rgba(0, 0, 0, 0.35); }
  body.t-ribbon.r-shine .m { overflow: visible; }
  body.t-ribbon.r-shine .m > div { position: relative; z-index: 1; }
  body.t-ribbon.r-shine .m .sh { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
  body.t-ribbon.r-shine .m .sh::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.22), transparent); animation: shine calc(4.5s * var(--as, 1)) ease-in-out infinite; animation-delay: var(--sd, 0s); }
  @keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  body.t-ribbon:not(.r-dots) .m::before { display: none; }
  body.t-ribbon.row .m::before { content: ""; position: absolute; left: -6px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: rgba(255, 236, 200, 0.85); box-shadow: 0 0 6px rgba(255, 210, 122, 0.8); }
  body.t-ribbon.row #list { gap: calc(var(--gap) + 6px); }
  body.t-ribbon .pf { fill: #fff; opacity: 0.85; }
  /* the name above the message, not beside it (and Cards' and Y2K's always) */
  body.above .m > div > .who, body.t-cards .m > div > .who { display: block; }
  body.above.t-pastel .m > div > .who { display: inline-block; margin-bottom: 0.2em; }
  /* how a message comes in */
  body.a-slide .m { animation-name: slide; }
  body.a-pop .m { animation-name: pop; animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1.4); }
  body.a-fade .m { animation-name: fade; }
  @keyframes slide { from { opacity: 0; transform: translateX(-40px); } }
  /* lined up on the right: each message's words to the right, its platform mark after them, sliding in from the right */
  body.right .m { flex-direction: row-reverse; text-align: right; }
  body.right.t-y2k .m { flex-direction: column; }
  body.right.t-y2k .m .who { flex-direction: row-reverse; }
  body.right.t-y2k .m .who::after { margin-left: 0; margin-right: auto; }
  body.right.t-y2k .pf { left: auto; right: 0.45em; }
  body.right.t-y2k.marks .m .who { padding-left: 0.5em; padding-right: 1.6em; }
  body.right.t-bubbles .m { border-left: 0; border-right: 3px solid var(--pc, #9146ff); border-radius: 12px 4px 4px 12px; }
  body.right.t-terminal .m { border-left: 0; border-right: 2px solid #3cff6e; }
  body.right.t-comic .m { border-radius: 18px 18px 4px 18px; }
  body.right.a-slide .m { animation-name: slideR; }
  @keyframes slideR { from { opacity: 0; transform: translateX(40px); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @keyframes fade { from { opacity: 0; } }
  /* events (a follow, a sub, a raid...) in with chat, as their own cards */
  .m.ev { --pc: var(--ec); align-items: center; }
  .m.ev .ic { flex: none; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--ec); color: #111; display: flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: 900; }
  .m.ev .text { font-weight: 700; }
  .m.ev .text b { color: var(--ec); }
  body.t-plain .m.ev, body.t-minimal .m.ev { background: color-mix(in srgb, var(--ec) 22%, rgba(10, 12, 18, 0.7)); }
  body.t-comic .m.ev .text b, body.t-y2k .m.ev .text b, body.t-pastel .m.ev .text b { color: #111; }
  body.t-y2k .m.ev { flex-direction: row; padding: 0.3em 0.5em; }
  /* pronouns, after the name */
  .pr { display: inline-block; font-size: 0.6em; font-weight: 700; padding: 0 0.35em; margin-right: 0.3em; border-radius: 0.3em; background: rgba(255, 255, 255, 0.18); vertical-align: 0.2em; }
  body.t-comic .pr, body.t-pastel .pr, body.t-y2k .pr { background: rgba(0, 0, 0, 0.12); }
  /* a first-time chatter: a little "new" tag, and a glow, so you notice and say hello */
  .new { display: inline-block; font-size: 0.6em; font-weight: 900; padding: 0 0.4em; margin-right: 0.3em; border-radius: 0.3em; background: #ffd36e; color: #111; vertical-align: 0.2em; letter-spacing: 0.04em; }
  .m.first { box-shadow: 0 0 0 2px #ffd36e, 0 0 14px rgba(255, 211, 110, 0.55); }
  .m.out { animation: out 0.6s ease-in forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  @keyframes out { to { opacity: 0; transform: translateY(-4px); } }
  /* in a row: a ticker, newest on the right (on the left, lined up on the right), the oldest going off the end */
  body.row #list { flex-direction: row; align-items: flex-end; justify-content: flex-end; flex-wrap: nowrap; overflow: hidden; }
  body.row.top #list { flex-direction: row; align-items: flex-start; }
  body.row.right #list { flex-direction: row-reverse; justify-content: flex-end; }
  body.row .m { max-width: min(60vw, 560px); }
  body.row.a-slide .m { animation-name: slideR; }
  body.row.right.a-slide .m { animation-name: slide; }
  /* how a message goes out, and how fast they all move (every theme) */
  body.o-slide .m.out { animation-name: outSlide; }
  body.o-shrink .m.out { animation-name: outShrink; }
  body.o-none .m.out { animation: none; opacity: 0; }
  @keyframes outSlide { to { opacity: 0; transform: translateX(-40px); } }
  @keyframes outShrink { to { opacity: 0; transform: scale(0.6); } }
  .m { animation-duration: calc(0.35s * var(--as, 1)); }
  .m.out { animation-duration: calc(0.6s * var(--as, 1)); }
  body.a-none .m { animation: none; }
  .pf { flex: none; width: 1.1em; height: 1.1em; margin-top: 0.12em; fill: var(--pc); }
  .who { font-weight: 800; white-space: nowrap; }
  .badge { display: inline-block; font-size: 0.62em; font-weight: 800; padding: 0 0.3em; margin-right: 0.25em; border-radius: 0.25em; vertical-align: 0.15em; color: #111; }
  .badge.bimg { min-width: 0; padding: 0; background: none; height: 1.1em; width: auto; vertical-align: -0.2em; border-radius: 2px; }
  .xb img { height: 1.1em; width: auto; margin-right: 0.22em; vertical-align: -0.2em; border-radius: 2px; }
  .badge.kb { background: #3a3f47; color: #e6e8ee; } .badge.kb-moderator, .badge.kb-verified { background: #53fc18; color: #0b0e0f; } .badge.kb-vip { background: #ffc93c; color: #1a1300; }
  .badge.kb-og { background: #4dd4ff; color: #04202a; } .badge.kb-founder { background: #ff8a3d; color: #1f0d00; } .badge.kb-broadcaster { background: #ff4f4f; color: #fff; } .badge.kb-staff { background: #a970ff; color: #fff; } .badge.kb-subscriber, .badge.kb-sub_gifter { background: #7aa2ff; color: #0a1330; }
  body.t-ribbon .m .badge.bimg { background: none; border: 0; }
  .badge.b-b { background: #ff4f4f; } .badge.b-m { background: #3ccd6c; } .badge.b-v { background: #e05ce0; } .badge.b-s { background: #7aa2ff; }
  .text { font-weight: 500; }
  .from { display: inline-block; font-size: 0.62em; font-weight: 800; padding: 0 0.4em; margin-right: 0.3em; border-radius: 999px; background: rgba(145, 70, 255, 0.35); vertical-align: 0.2em; }
  .text img { height: 1.5em; vertical-align: middle; margin: -0.25em 0; }

  /* its settings: only while the pointer's over it (OBS's Interact), never on stream otherwise */
  #gear { position: fixed; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 17px; border: 0; background: #000a; color: #fff; font-size: 18px; cursor: pointer; opacity: 0; transition: opacity 0.2s; }
  body:hover #gear { opacity: 1; }
  #panel { position: fixed; top: 48px; right: 8px; width: 290px; max-height: calc(100% - 56px); overflow: auto; background: #14161ef2; border: 1px solid #2e323d; border-radius: 14px; padding: 12px 14px; font: 400 13px / 1.4 "Segoe UI", system-ui, sans-serif; color: #e6e8ee; display: none; text-shadow: none; }
  #panel.open { display: block; }
  #panel h2 { margin: 6px 0 4px; font-size: 11px; font-weight: 700; color: #8b91a1; letter-spacing: 0.06em; text-transform: uppercase; }
  #panel label { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 3px 0; }
  #panel select, #panel input[type=number] { background: #1b1d24; color: #e6e8ee; border: 1px solid #2e323d; border-radius: 6px; padding: 2px 4px; width: 110px; }
  #panel .addr { margin-top: 8px; font-size: 11px; color: #8b91a1; word-break: break-all; }
</style>
</head>
<body class="shadow">
<div id="list"></div>
<button id="gear" aria-label="Settings" title="Settings">&#9881;</button>
<div id="panel">
  <h2>Show</h2>
  <label>Chat from <select id="oFrom"><option value="all">Every platform</option><option value="twitch">Twitch only</option><option value="kick">Kick only</option><option value="youtube">YouTube only</option></select></label>
  <label>Commands (!sr...) <input type="checkbox" id="oCmds"></label>
  <label>The bot's own <input type="checkbox" id="oBot" checked></label>
  <label>Badges <input type="checkbox" id="oBadges" checked></label>
  <label>Platform marks <input type="checkbox" id="oMarks" checked></label>
  <label>Pronouns (Twitch) <input type="checkbox" id="oPronouns"></label>
  <label>Follows, subs and raids <input type="checkbox" id="oEvents"></label>
  <label>First-time chatters stand out <input type="checkbox" id="oFirst" checked></label>
  <h2>Look</h2>
  <label>Theme <select id="oStyle"><option value="plain">Plain</option><option value="bubbles">Bubbles</option><option value="glass">Glass</option><option value="neon">Neon</option><option value="cards">Cards</option><option value="terminal">Terminal</option><option value="comic">Comic</option><option value="minimal">Minimal</option><option value="edge">Edge Light</option><option value="y2k">Y2K Window</option><option value="pastel">Pastel</option><option value="pixel">Pixel</option><option value="ribbon">Ribbon (for In a Row)</option></select></label>
  <label>Name <select id="oName"><option value="beside">Beside the message</option><option value="above">Above it</option></select></label>
  <label>Ribbon colours <select id="oRcol"><option value="sunset">Sunset</option><option value="ocean">Ocean</option><option value="candy">Candy</option><option value="forest">Forest</option><option value="fire">Fire</option><option value="mono">Mono</option><option value="theme">Your theme's</option></select></label>
  <label>Ribbon icon <select id="oRicon"><option value="chat">Chat bubble</option><option value="heart">Heart</option><option value="star">Star</option><option value="note">Music note</option><option value="platform">The platform's</option><option value="none">None</option></select></label>
  <label>Ribbon dots <input type="checkbox" id="oRdots" checked></label>
  <label>Ribbon glow <input type="checkbox" id="oRglow"></label>
  <label>Ribbon shine <input type="checkbox" id="oRshine"></label>
  <label>Layout <select id="oFlow"><option value="stack">Stacked</option><option value="row">In a row (a ticker)</option></select></label>
  <label>Coming in <select id="oAnim"><option value="rise">Rise</option><option value="slide">Slide</option><option value="pop">Pop</option><option value="fade">Fade</option><option value="none">No animation</option></select></label>
  <label>Going out <select id="oOut"><option value="fade">Fade</option><option value="slide">Slide</option><option value="shrink">Shrink</option><option value="none">No animation</option></select></label>
  <label>Animation speed <select id="oSpeed"><option value="slow">Slow</option><option value="normal">Normal</option><option value="fast">Fast</option></select></label>
  <label>Text size <input type="number" id="oSize" min="10" max="60" step="1"></label>
  <label>Background <select id="oBg"><option value="0">None</option><option value="0.35">Faint</option><option value="0.6">Half</option><option value="0.85">Solid</option></select></label>
  <label>Shadow <input type="checkbox" id="oShadow" checked></label>
  <label>Line up on the <select id="oAlign"><option value="left">Left</option><option value="right">Right</option></select></label>
  <label>Newest at the <select id="oDir"><option value="bottom">Bottom</option><option value="top">Top</option></select></label>
  <h2>Time</h2>
  <label>Fade after (seconds, 0: never) <input type="number" id="oFade" min="0" max="600" step="1"></label>
  <label>At most <input type="number" id="oMax" min="1" max="100" step="1"></label>
  <div class="addr" id="addr"></div>
</div>
<script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  const DEFAULTS = { from: "all", cmds: false, bot: true, badges: true, marks: true, style: "plain", size: 20, bg: "0", shadow: true, dir: "bottom", align: "left", flow: "stack", out: "fade", speed: "normal", rcol: "sunset", ricon: "chat", rdots: true, rglow: false, rshine: false, fade: 0, max: 30, bttv: true, ffz: true, stv: true, name: "beside", anim: "rise", events: false, pronouns: false, first: true };
  // (/chat/2, /chat/3...: another output, its settings kept apart from the first's)
  const OUT = (location.pathname.match(/^\/chat\/(\d+)/) || [])[1];
  const KEY = "omnipulse.multichat" + (OUT ? "." + OUT : "");
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
  };
  // (the address's settings win over the ones kept: a source per scene, each its own)
  const fromUrl = {};
  new URLSearchParams(location.search).forEach((v, k) => { if (k in DEFAULTS) fromUrl[k] = typeof DEFAULTS[k] === "boolean" ? v === "1" || v === "true" : typeof DEFAULTS[k] === "number" ? Number(v) : v; });
  const opt = Object.assign({}, DEFAULTS, store.get(), fromUrl);

  // (how long animations take: slow, normal, fast)
  const ANIM_SPEED = () => ({ slow: 1.8, fast: 0.55 })[opt.speed] || 1;
  const THEMES = ["plain", "bubbles", "glass", "neon", "cards", "terminal", "comic", "minimal", "edge", "y2k", "pastel", "pixel", "ribbon"];
  // (Ribbon's colours: a warm pair for each card in turn, so the row shifts along like a sunset)
  // (its palettes, a pair for each card in turn; "theme": your app theme's own colours)

    ["ModMaya", "remember to hydrate chat", "twitch", "#3ccd6c", ["moderator"]], ["lofi_larry", "what's this song?", "twitch", "#7aa2ff", []],
    ["Zed", "GG that was close", "kick", "#ffd24a", ["vip"]], ["Nova", "first time here, love the vibes", "youtube", "#e05ce0", []],
    ["RaidLeader", "we came from the raid!", "twitch", "#ff4f8b", ["vip"]], ["quietcat", "lurking but enjoying it", "kick", "#5ad1ff", ["moderator"]],
  ];
  // (Twitch's own pictures for its badges; Kick's by name)
  const TW_BADGE = { subscriber: ["5d9f2208-5dd8-11e7-8513-2ff4adfae661", "Subscriber"], moderator: ["3267646d-33f0-4b17-b3df-f923a41db1d0", "Moderator"], vip: ["b817aba4-fad8-49e2-b88a-7cc744dfa6ec", "VIP"] };
  const KICK_NAME = { og: "OG", vip: "VIP", moderator: "Moderator" };
  let sampleN = 0;
  function sample(again) {
    const pick = SAMPLES.filter((x) => opt.from === "all" || opt.from === x[2]);
    const x = (pick.length ? pick : SAMPLES)[sampleN % (pick.length || SAMPLES.length)];
    sampleN++;
    const badgeImgs = x[2] === "twitch" ? x[4].filter((b) => TW_BADGE[b]).map((b) => ({ url: "https://static-cdn.jtvnw.net/badges/v1/" + TW_BADGE[b][0] + "/2", title: TW_BADGE[b][1] })) : [];
    const badgeList = x[2] === "kick" ? x[4].map((b) => ({ type: b, text: KICK_NAME[b] || b })) : undefined;
    add({ n: sampleN, ts: Date.now(), user: x[0], login: x[0].toLowerCase(), text: x[1], platform: x[2], color: x[3], badges: x[4], badgeImgs, badgeList, first: sampleN === 6 });
    const keep = Math.max(1, Number(opt.max) || 30);
    for (const n of [...rows.keys()]) if (n <= sampleN - keep) gone(n);
    if (again) setTimeout(() => sample(true), 2000);
  }
  async function poll() {
    if (PREV) { for (let i = 0; i < 3; i++) sample(false); sample(true); return; }
    if (OFF) { setTimeout(poll, 2000); return; }
    try {
      const j = await (await fetch("/dock/chat.json?after=" + Math.max(0, last), { cache: "no-store" })).json();
      if (j.last < last) last = -1;
      // (opened now: only the last few, as it'd have shown them, not the whole kept list)
      const items = j.items || [];
      const fresh = last < 0 ? items.slice(-Math.max(1, Number(opt.max) || 30)).filter((m) => !(Number(opt.fade) > 0) || Date.now() - m.ts < Number(opt.fade) * 1000) : items;
      fresh.forEach(add);
      if (items.length) last = Math.max(last, ...items.map((m) => m.n)); else if (last < 0) last = j.last || 0;
      for (const n of j.gone || []) gone(n);
    } catch (e) {}
    setTimeout(poll, 700);
  }
  apply();
  poll();
  pollEvents();
</script>
