<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  The Stream Suite's widgets, for OBS: one page, each its own address (a Browser source each).
    /goals          the goals (follows, subs, bits, donations), filling up as they come in
    /timer          a countdown, or a stopwatch (a subathon's time added as things happen)
    /latest-follow  who followed last
    /latest-sub     who subscribed last
    /raid           a raid's shoutout (and one of the raider's clips, if it's set to)
  Set in the app: Settings > Streaming > Suite. It reads /now.json's "suite", which the Suite sends.
-->
<title>OmniPulse Suite</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #fff; --c1: #8e9bff; --c2: #b48eff; }
  body.preview { background: #2a2a2e repeating-conic-gradient(#3a3a40 0 25%, #2a2a2e 0 50%) 0 0 / 32px 32px; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .panel { background: rgba(10, 8, 20, 0.82); border-radius: 0.9rem; padding: 0.8rem 1rem; box-sizing: border-box; box-shadow: 0 0.3rem 1rem rgba(0, 0, 0, 0.35); }
  /* the fun's: the hype meter, vote skip, the wheel, the leaderboard, emote rain */
  #hype, #skip { width: 94%; }
  #hype .row, #skip .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.35rem; }
  #hype .lv { font-weight: 800; font-size: 1.1rem; }
  #skip .ct { font-weight: 800; font-variant-numeric: tabular-nums; }
  #skip .song { font-size: 0.85rem; opacity: 0.8; margin-bottom: 0.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hype .tr, #skip .tr { height: 0.9rem; border-radius: 0.5rem; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
  #hype .fl, #skip .fl { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--c1), var(--c2)); transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
  /* Name That Tune: the hint, a countdown, and who got it */
  #tune { width: 94%; text-align: center; }
  #tune .lbl { font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
  #tune .hint { font-size: 1.9rem; font-weight: 800; letter-spacing: 0.18em; margin: 0.3rem 0 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  #tune .tr { height: 0.6rem; border-radius: 0.5rem; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
  #tune .fl { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--c1), var(--c2)); transition: width 1s linear; }
  #tune.done .hint { letter-spacing: 0.02em; font-size: 1.5rem; }
  #tune.done .tr { display: none; }
  #hype.train .row { align-items: center; gap: 0.5rem; }
  #hype.train .ic { flex: none; width: 1.9rem; height: 1.9rem; border-radius: 0.55rem; background: linear-gradient(135deg, var(--c1), var(--c2)); display: flex; align-items: center; justify-content: center; }
  #hype.train .ic svg { width: 70%; height: 70%; fill: #fff; }
  #hype.train .lbl { flex: 1; font-weight: 800; }
  #hype.train .low { margin: 0.35rem 0 0; font-size: 0.85rem; opacity: 0.85; }
  #hype.train .top { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hype.train .pf svg { width: 1rem; height: 1rem; fill: currentColor; margin-left: 0.3rem; vertical-align: -0.15rem; }
  #hype.train .left { font-variant-numeric: tabular-nums; font-weight: 800; margin-left: 0.6rem; }
  #hype.train.ended .fl { background: linear-gradient(90deg, #3ddc84, #b6ff5e); }
  #hype.up { animation: flare 1.2s ease-out; }
  @keyframes flare { 0% { box-shadow: 0 0 0 0 var(--c1); transform: scale(1); } 30% { box-shadow: 0 0 2.4rem 0.6rem var(--c1); transform: scale(1.04); } 100% { box-shadow: 0 0.3rem 1rem rgba(0, 0, 0, 0.35); transform: scale(1); } }
  #wheel { position: relative; width: 30rem; height: 30rem; }
  #wheel .disc { position: absolute; inset: 1.5rem 0 0 0; margin: 0 auto; width: 28rem; height: 28rem; border-radius: 50%; box-shadow: 0 0 0 0.4rem rgba(255, 255, 255, 0.85), 0 0.6rem 2rem rgba(0, 0, 0, 0.5); overflow: hidden; }
  #wheel .disc span { position: absolute; left: 50%; top: 0; height: 50%; transform-origin: 50% 100%; display: flex; justify-content: center; padding-top: 1.1rem; width: 0; }
  #wheel .disc b { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 1rem; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7); white-space: nowrap; max-height: 11rem; overflow: hidden; text-overflow: ellipsis; }
  #wheel .pin { position: absolute; left: 50%; top: 0.2rem; transform: translateX(-50%); width: 0; height: 0; border-left: 1rem solid transparent; border-right: 1rem solid transparent; border-top: 1.8rem solid #fff; z-index: 2; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.6)); }
  #wheel .won { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%) scale(0.6); background: rgba(10, 8, 20, 0.9); padding: 0.6rem 1.1rem; border-radius: 0.8rem; font-size: 1.3rem; font-weight: 800; opacity: 0; transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.3); white-space: nowrap; }
  #wheel .won.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #wheel.light .disc b { color: #2a1a3a; text-shadow: none; }
  #wheel { transition: opacity 0.6s, transform 0.6s; }
  #wheel.idle { opacity: 0; transform: scale(0.85); }
  #board { width: 92%; }
  #board .ln { display: flex; gap: 0.7rem; align-items: center; padding: 0.3rem 0; font-size: 1.05rem; }
  #board .rk { width: 1.6rem; height: 1.6rem; border-radius: 50%; background: linear-gradient(135deg, var(--c1), var(--c2)); display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; flex: none; }
  #board .nm { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #board .pt { font-variant-numeric: tabular-nums; opacity: 0.85; }
  body.rainy #stage { display: block; overflow: hidden; }
  img.rain { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform, opacity; }
  /* their themes (each widget's settings in the Suite): Dark as above, the rest their own */
  body.t-glass .panel { background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.28); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: none; }
  body.t-neon .panel { background: rgba(8, 6, 20, 0.88); border: 2px solid var(--c1); box-shadow: 0 0 16px var(--c1); }
  body.t-comic .panel { background: #fff; color: #111; border: 3px solid #111; box-shadow: 4px 4px 0 #111; }
  body.t-comic .goal .tr { background: rgba(0, 0, 0, 0.12); }
  body.t-minimal .panel { background: none; box-shadow: none; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9); }
  .panel { position: relative; }
  /* Pastel: soft and round, in a light tint of your colour */
  body.t-pastel .panel { background: color-mix(in srgb, var(--c1) 12%, #fffafc); color: #3a2a4a; border: 0.2rem solid color-mix(in srgb, var(--c1) 45%, #fff); border-radius: 1.4rem; box-shadow: 0 0.4rem 1.2rem rgba(60, 20, 80, 0.28); }
  body.t-pastel .goal .tr, body.t-pastel #hype .tr, body.t-pastel #skip .tr, body.t-pastel #tune .tr { background: rgba(60, 20, 80, 0.12); }
  /* Y2K: an old computer's window, its title bar on top */
  body.t-y2k .panel { background: #fdf6ff; color: #2b1b40; border: 0.15rem solid #2b1b40; border-radius: 0.4rem; box-shadow: 0.3rem 0.3rem 0 #2b1b40; padding-top: 2.1rem; }
  body.t-y2k .panel::after { content: "\2013  \25A1  \00D7"; position: absolute; left: 0; right: 0; top: 0; height: 1.4rem; line-height: 1.4rem; padding-right: 0.6rem; text-align: right; font-size: 0.8rem; font-weight: 900; letter-spacing: 0.2em; color: #2b1b40; background: linear-gradient(90deg, #ff9ad5, #b9a4ff 55%, #9ad0ff); border-bottom: 0.15rem solid #2b1b40; border-radius: 0.25rem 0.25rem 0 0; }
  body.t-y2k .goal .tr, body.t-y2k #hype .tr, body.t-y2k #skip .tr, body.t-y2k #tune .tr { background: rgba(43, 27, 64, 0.14); }
  /* Pixel: an old game's box */
  body.t-pixel { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; }
  body.t-pixel .panel { background: #1b1030; border-radius: 0; box-shadow: 0 -0.25rem 0 #f4f0ff, 0 0.25rem 0 #f4f0ff, -0.25rem 0 0 #f4f0ff, 0.25rem 0 0 #f4f0ff, inset 0 0 0 0.22rem var(--c1); }
  body.t-pixel .tr, body.t-pixel .fl { border-radius: 0 !important; }
  /* Edge Light: smoked glass, a stroke of light running round its edge */
  @property --edge { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  body.t-edge .panel { background: rgba(12, 10, 24, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  body.t-edge .panel::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 0.15rem; pointer-events: none;
    background: conic-gradient(from var(--edge), transparent 0 62%, var(--c1) 80%, #fff 86%, var(--c2) 90%, transparent 96%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: edge 3.6s linear infinite; }
  @keyframes edge { to { --edge: 360deg; } }
  /* Sticker: made for a GIF on top, a white die-cut edge round it all */
  body.t-sticker .panel { background: #fff; color: #1d1530; border-radius: 1.2rem; box-shadow: 0 0 0 0.3rem #fff, 0 0.5rem 1.4rem rgba(0, 0, 0, 0.45); transform: rotate(-1.5deg); }
  body.t-sticker .goal .tr, body.t-sticker #hype .tr, body.t-sticker #skip .tr, body.t-sticker #tune .tr { background: rgba(0, 0, 0, 0.1); }
  body.t-sticker .gifme::before { filter: drop-shadow(0 0 0.18rem #fff) drop-shadow(0 0 0.18rem #fff) drop-shadow(0 0.3rem 0.5rem rgba(0, 0, 0, 0.4)); }
  /* a GIF with it, wherever it's set to go */
  .gifme { position: relative; }
  .gifme::before { content: ""; position: absolute; width: var(--gs); height: var(--gs); background: var(--gif) center / contain no-repeat; pointer-events: none; z-index: 3; }
  body.gp-top .gifme::before { left: 50%; bottom: 100%; transform: translate(-50%, 22%); }
  body.gp-left .gifme::before { right: 100%; top: 50%; transform: translate(18%, -50%); }
  body.gp-right .gifme::before { left: 100%; top: 50%; transform: translate(-18%, -50%); }
  body.gp-corner .gifme::before { right: 0; top: 0; width: calc(var(--gs) * 0.7); height: calc(var(--gs) * 0.7); transform: translate(40%, -55%); }
  .lbl { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; }
  .big { font-size: 1.5rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* how they come in (the Suite's Widget Animation) */
  .in { animation: var(--in, rise-in) 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .out { animation: var(--out, rise-out) 0.5s ease-in both; }
  @keyframes rise-in { from { opacity: 0; transform: translateY(1rem); } }
  @keyframes rise-out { to { opacity: 0; transform: translateY(-0.7rem); } }
  @keyframes slide-in { from { opacity: 0; transform: translateX(-2.2rem); } }
  @keyframes slide-out { to { opacity: 0; transform: translateX(2.2rem); } }
  @keyframes flip-in { from { opacity: 0; transform: perspective(30rem) rotateX(-85deg); } }
  @keyframes flip-out { to { opacity: 0; transform: perspective(30rem) rotateX(85deg); } }
  @keyframes pop-in { 0% { opacity: 0; transform: scale(0.5); } 70% { opacity: 1; transform: scale(1.07); } }
  @keyframes pop-out { to { opacity: 0; transform: scale(0.7); } }
  body.still .in, body.still .out { animation: none !important; }

  /* goals: a bar each (or rings), filling smoothly; a burst when one's reached */
  #goals { display: flex; flex-direction: column; gap: 0.55rem; width: 92%; }
  .goal { position: relative; }
  .goal .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.3rem; }
  .goal .nm { font-weight: 700; font-size: 1rem; }
  .goal .ct { font-variant-numeric: tabular-nums; font-size: 0.9rem; opacity: 0.85; }
  .goal .tr { height: 0.7rem; border-radius: 0.4rem; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
  .goal .fl { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--c1), var(--c2)); transition: width 1.2s cubic-bezier(0.2, 0.8, 0.2, 1); position: relative; }
  .goal .fl::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent); transform: translateX(-100%); animation: shine 2.6s ease-in-out infinite; }
  @keyframes shine { 60%, 100% { transform: translateX(100%); } }
  .goal.done .fl { background: linear-gradient(90deg, #3ddc84, #b6ff5e); }
  .goal.burst::before { content: ""; position: absolute; inset: -0.4rem; border-radius: 0.8rem; border: 0.15rem solid #b6ff5e; animation: burst 1.2s ease-out both; }
  @keyframes burst { from { opacity: 1; transform: scale(0.96); } to { opacity: 0; transform: scale(1.08); } }
  body.rings #goals { flex-direction: row; justify-content: center; gap: 1.2rem; }
  body.rings .goal { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  body.rings .goal .tr { width: 5rem; height: 5rem; border-radius: 50%; background: conic-gradient(var(--c1) calc(var(--p, 0) * 1%), rgba(255, 255, 255, 0.16) 0); display: flex; align-items: center; justify-content: center; transition: --p 1.2s; }
  body.rings .goal .tr::after { content: attr(data-pct); width: 3.9rem; height: 3.9rem; border-radius: 50%; background: rgba(10, 8, 20, 0.9); display: flex; align-items: center; justify-content: center; font-weight: 800; }
  body.rings .goal .fl { display: none; }
  body.rings .goal .row { flex-direction: column; align-items: center; margin: 0; }
  body.rings .goal .nm { white-space: nowrap; font-size: 0.85rem; }
  /* goals as shapes: liquid filling one, a jar of drops piling up, or an hourglass; side by side */
  body.shapes #goals { flex-direction: row; justify-content: center; align-items: flex-end; gap: 1.4rem; width: auto; max-width: 96%; }
  body.shapes .goal { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; width: 9rem; }
  body.shapes .goal .tr, body.shapes .goal .fl { display: none; }
  body.shapes .goal .row { flex-direction: column; align-items: center; margin: 0; order: 2; }
  body.shapes .goal .nm { white-space: nowrap; font-size: 0.9rem; }
  .goal .shape { width: 100%; aspect-ratio: 100 / 110; position: relative; }
  body.hourglass .goal .shape { aspect-ratio: 100 / 140; width: 75%; }
  .goal .shape svg { width: 100%; height: 100%; overflow: visible; }
  .goal .shape .lvl { transition: transform 1.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .goal .shape .wave { animation: wave 3.2s linear infinite; }
  .goal .shape .wave.back { animation-duration: 5s; animation-direction: reverse; opacity: 0.55; }
  @keyframes wave { to { transform: translateX(-100px); } }
  .goal .shape .glass { fill: rgba(255, 255, 255, 0.1); stroke: rgba(255, 255, 255, 0.9); stroke-width: 3; stroke-linejoin: round; }
  .goal .shape .deco { fill: none; stroke: rgba(255, 255, 255, 0.9); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .goal .shape .eye { fill: rgba(20, 10, 40, 0.85); }
  .goal .shape .shine { fill: none; stroke: rgba(255, 255, 255, 0.55); stroke-width: 3; stroke-linecap: round; }
  .goal .shape .pc { font-weight: 900; font-size: 15px; fill: #fff; paint-order: stroke; stroke: rgba(0, 0, 0, 0.45); stroke-width: 3px; }
  /* your own picture as the shape: the liquid seen through it */
  .goal .shape .own { position: absolute; inset: 0; -webkit-mask: var(--own) center / contain no-repeat; mask: var(--own) center / contain no-repeat; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
  .goal .shape .own .liq { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, var(--c1), var(--c2)); transition: height 1.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .goal .shape .ownpic { position: absolute; inset: 0; background: var(--own) center / contain no-repeat; opacity: 0.35; mix-blend-mode: screen; }
  /* the jar's drops: each new one falls and squishes as it lands */
  .goal .shape .drop { animation: jarfall 0.9s cubic-bezier(0.5, 0, 0.75, 0) both, squish 0.5s 0.9s ease-out both; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes jarfall { from { transform: translateY(-120px); } }
  @keyframes squish { 0% { transform: scale(1.25, 0.75); } 50% { transform: scale(0.92, 1.08); } 100% { transform: scale(1, 1); } }
  /* the hourglass: sand falling, and turning over when it's full */
  .goal .shape .stream { stroke: #f6d38a; stroke-width: 2.4; stroke-dasharray: 3 4; animation: pour 0.5s linear infinite; }
  @keyframes pour { to { stroke-dashoffset: -7; } }
  .goal .shape.turn svg { animation: turn 1.1s cubic-bezier(0.6, 0, 0.3, 1) both; }
  @keyframes turn { from { transform: rotate(0deg); } to { transform: rotate(180deg); } }
  .goal .round { font-size: 0.75rem; opacity: 0.75; }
  .goal.done .shape .glass { stroke: #b6ff5e; }
  body.still .goal .shape .wave, body.still .goal .shape .stream { animation: none; }
  .confetti { position: fixed; width: 0.45rem; height: 0.7rem; border-radius: 0.1rem; z-index: 5; pointer-events: none; animation: confetti 1.6s cubic-bezier(0.2, 0.7, 0.4, 1) forwards; }
  @keyframes confetti { to { transform: translate(var(--dx), calc(var(--dy) + 9rem)) rotate(var(--rot)); opacity: 0; } }
  @property --p { syntax: "<number>"; inherits: false; initial-value: 0; }

  /* the timer: its digits, ticking; a pulse as time's added */
  #timer { text-align: center; }
  #timer .t { font-size: 3.2rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; text-shadow: 0 0 1rem color-mix(in srgb, var(--c1) 60%, transparent); }
  #timer.paused .t { opacity: 0.55; }
  #timer .add { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font-weight: 800; color: #b6ff5e; animation: added 2s ease-out both; }
  @keyframes added { from { opacity: 0; transform: translate(-50%, 0.6rem); } 20% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -1.6rem); } }

  /* the latest follow or sub: who, sliding in each time it changes */
  .latest { display: flex; align-items: center; gap: 0.8rem; min-width: 60%; max-width: 96%; }
  .latest .ic { flex: none; width: 2.6rem; height: 2.6rem; border-radius: 0.7rem; background: linear-gradient(135deg, var(--c1), var(--c2)); display: flex; align-items: center; justify-content: center; }
  .latest .ic svg { width: 60%; height: 60%; fill: #fff; }
  .latest .tx { min-width: 0; display: flex; flex-direction: column; }

  /* a raid's shoutout, and maybe a clip of theirs */
  #raid { display: flex; flex-direction: column; align-items: center; gap: 0.7rem; width: 94%; }
  #raid .head { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; }
  #raid .go { font-weight: 900; font-size: 1rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--c1); animation: go-in 0.8s 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; }
  @keyframes go-in { from { opacity: 0; letter-spacing: 1.2em; } }
  #raid .head .big { font-size: 2.3rem; background: linear-gradient(90deg, #fff 0%, var(--c1) 30%, #fff 50%, var(--c2) 70%, #fff 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: name-shine 3.2s linear infinite, name-in 0.7s 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
  @keyframes name-shine { to { background-position: -250% 0; } }
  @keyframes name-in { from { opacity: 0; transform: scale(0.6); } }
  #raid .where { display: flex; align-items: center; gap: 0.45rem; font-weight: 700; font-size: 1.05rem; padding: 0.35rem 0.9rem; border-radius: 999px; background: linear-gradient(90deg, var(--c1), var(--c2)); animation: name-in 0.6s 0.6s both; }
  #raid .where svg { width: 1.1rem; height: 1.1rem; fill: #fff; animation: beat 1.1s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.25); } 40% { transform: scale(0.95); } }
  #raid iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 0.7rem; background: #000; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  const PATH = location.pathname.replace(/\.html$/, "").replace(/\/$/, "") || "/goals";
  const PREVIEW = /[?&]preview=1/.test(location.search);
  if (PREVIEW) document.body.classList.add("preview");
  const HEART = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z";
  const STAR = "M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z";
  const MOTIONS = { rise: ["rise-in", "rise-out"], slide: ["slide-in", "slide-out"], flip: ["flip-in", "flip-out"], pop: ["pop-in", "pop-out"] };
  let suite = null, shown = "", timerT = null, lastAdded = -1, raidT = null;

      tuneTick = setInterval(() => { const f = box.querySelector(".fl"); if (f) f.style.width = left() * 100 + "%"; }, 1000);
    } else {
      clearInterval(tuneTick);
      box.querySelector(".lbl").textContent = n.winner ? n.winner + " got it!" : "Nobody got it";
      box.querySelector(".hint").textContent = n.title + (n.artist ? " — " + n.artist : "");
      setTimeout(draw, 10500);
    }
  }
  function voteskip() {
    const v = suite.voteskip || {};
    let box = $("skip");
    // (only while there are votes: nothing on stream otherwise)
    if (!v.on || !v.votes) { if (box) { moving(box); box.classList.add("out"); setTimeout(() => box.remove(), 500); } return; }
    if (!box) { box = document.createElement("div"); box.id = "skip"; box.className = "panel"; box.innerHTML = '<div class="row"><span class="lbl"></span><span class="ct"></span></div><div class="song"></div><div class="tr"><div class="fl"></div></div>'; swap(box); }
    box.querySelector(".lbl").textContent = "Skip this song? Type " + (v.command || "!skip");
    box.querySelector(".ct").textContent = v.votes + " / " + v.need;
    box.querySelector(".song").textContent = v.song || "";
    box.querySelector(".fl").style.width = Math.min(100, (v.votes / Math.max(1, v.need)) * 100) + "%";
  }
  let wheelAt = 0;
  function wheel() {
    const w = suite.wheel || {};
    const prizes = w.prizes || [];
    let box = $("wheel");
    const weights = prizes.map((_, i) => Math.max(1, Number((w.weights || [])[i]) || 1)), total = weights.reduce((a, b) => a + b, 0) || 1;
    // (each prize's slice, as big as its chance)
    const starts = weights.map((_, i) => (weights.slice(0, i).reduce((a, b) => a + b, 0) / total) * 360);
    const sizeOf = (i) => (weights[i] / total) * 360;
    const sig = prizes.join("|") + "|" + weights.join(",") + "|" + (w.colors || "theme");
    const PALS = { rainbow: (i, n) => "hsl(" + Math.round((i / n) * 360) + " 80% 58%)", pastel: (i, n) => "hsl(" + Math.round((i / n) * 360) + " 75% 78%)",
      alternate: (i) => (i % 2 ? "var(--c2)" : "var(--c1)"), theme: (i, n) => "color-mix(in srgb, var(--c1) " + Math.round(100 - (i / n) * 70) + "%, var(--c2))" };
    const col = PALS[w.colors] || PALS.theme;
    if (!box || box.dataset.sig !== sig) {
      if (box) box.remove();
      box = document.createElement("div"); box.id = "wheel"; box.dataset.sig = sig;
      if (w.colors === "pastel") box.classList.add("light");
      const n = Math.max(1, prizes.length);
      const stops = prizes.map((_, i) => col(i, n) + " " + starts[i] + "deg " + (starts[i] + sizeOf(i)) + "deg").join(", ");
      box.innerHTML = '<div class="pin"></div><div class="disc" style="background: conic-gradient(' + stops + ')">' +
        prizes.map((p, i) => '<span style="transform: rotate(' + (starts[i] + sizeOf(i) / 2) + 'deg)"><b>' + esc(p) + '</b></span>').join("") + '</div><div class="won"></div>';
      swap(box);
    }
    const secs = Math.max(3, Math.min(12, Number(w.secs) || 6));
    // (only while it spins, and a few seconds after, if it's set to)
    box.classList.toggle("idle", !!w.hide && !(w.at && Date.now() - w.at < secs * 1000 + 6000));
    if (w.hide && w.at) { clearTimeout(box.hideT); box.hideT = setTimeout(draw, Math.max(0, w.at + secs * 1000 + 6100 - Date.now())); }
    // (a new spin: round several times, landing with its prize under the pin at the top)
    if (w.at && w.at !== wheelAt) {
      const turns = 5 + Math.floor(Math.random() * 3);
      // (somewhere in its slice, not always its middle)
      const at = starts[w.pick] + sizeOf(w.pick) * (0.25 + Math.random() * 0.5);
      const to = turns * 360 + (360 - at);
      const disc = box.querySelector(".disc");
      const fresh = Date.now() - w.at < secs * 1000 - 1000;
      disc.style.transition = fresh ? "transform " + secs + "s cubic-bezier(0.12, 0.7, 0.2, 1)" : "none";
      disc.style.transform = "rotate(" + to + "deg)";
      const won = box.querySelector(".won");
      won.textContent = "";
      won.classList.remove("show");
      setTimeout(() => { won.textContent = (w.user ? w.user + ": " : "") + (prizes[w.pick] || ""); won.classList.add("show"); }, fresh ? secs * 1000 + 100 : 0);
      wheelAt = w.at;
    }
  }
  function leaderboard() {
    const b = suite.leaderboard || {};
    let box = $("board");
    if (!box) { box = document.createElement("div"); box.id = "board"; box.className = "panel"; swap(box); }
    const list = b.list || [];
    box.innerHTML = '<div class="lbl">Top ' + esc(b.name || "points") + '</div>' + (list.length ? list.map((x, i) => '<div class="ln"><span class="rk">' + (i + 1) + '</span><span class="nm">' + esc(x.user) + '</span><span class="pt">' + Math.round(x.points) + '</span></div>').join("") : '<div class="ln"><span class="nm">No one yet</span></div>');
  }
  // (emote rain: chat's emotes, as the Chat Dock has them (Twitch's, Kick's, and 7TV, BTTV and FFZ's), falling;
  // a burst (a sub, a raid, a big cheer, or the step) pours the latest ones)
  let rainAfter = -1, rainBurst = -1, rainThird = new Map(), recent = [];
  async function rainPoll() {
    try {
      if (!rainThird.size) { const e = await (await fetch("/dock/emotes.json", { cache: "no-store" })).json(); (e.list || []).forEach((x) => rainThird.set(x.c, x.u)); }
      // (the first look: from now on, so a refresh in OBS doesn't rain what was said before)
      if (rainAfter < 0) { const j0 = await (await fetch("/dock/chat.json?after=999999999", { cache: "no-store" })).json(); rainAfter = Number(j0.last || 0); return; }
      const j = await (await fetch("/dock/chat.json?after=" + rainAfter, { cache: "no-store" })).json();
      for (const m of j.items || []) {
        rainAfter = Math.max(rainAfter, Number(m.n || 0));
        if (m.notice || m.gone) continue;
        // (each one said rains, if it's set to; kept for the bursts either way; your own pictures only: none of chat's)
        const r = rainSet();
        emotesOf(m).slice(0, 6).forEach((u) => { if (r.chat && r.src !== "mine") drop(u); recent.push(u); });
      }
      recent = recent.slice(-30);
    } catch (e) {}
  }
  function emotesOf(m) {
    const out = [], text = String(m.text || "");
    if (m.platform === "kick") { const re = /\[emote:(\d+):[^\]]*\]/g; let x; while ((x = re.exec(text))) out.push("https://files.kick.com/emotes/" + x[1] + "/fullsize"); }
    else String(m.emotes || "").split("/").filter(Boolean).forEach((part) => { const [id, places] = part.split(":"); (places || "").split(",").forEach(() => out.push("https://static-cdn.jtvnw.net/emoticons/v2/" + encodeURIComponent(id) + "/default/dark/2.0")); });
    text.split(/\s+/).forEach((w) => { const u = rainThird.get(w); if (u) out.push(u); });
    return out;
  }
  // (how it rains, as set: which way, from where (everywhere, or a spot such as your camera), how big and fast)
  const rainSet = () => Object.assign({ src: "chat", imgs: [], chat: true, dir: "down", from: "all", x: 85, y: 85, size: "medium", speed: "normal", amount: 30, spin: true, max: 80 }, (suite && suite.rain) || {});
  const SPOTS = { bl: [12, 85], br: [88, 85], tl: [12, 15], tr: [88, 15], c: [50, 50], b: [50, 95] };
  function drop(u) {
    const stage = $("stage"), r = rainSet();
    if (stage.childElementCount > Math.max(10, Number(r.max) || 80)) return;
    const W = innerWidth, H = innerHeight;
    const base = { small: 30, medium: 46, large: 70 }[r.size] || 46, s = base * (0.75 + Math.random() * 0.5);
    const pace = { slow: 1.6, normal: 1, fast: 0.6 }[r.speed] || 1;
    const spot = r.from === "all" ? null : (r.from === "custom" ? [Number(r.x) || 50, Number(r.y) || 50] : SPOTS[r.from] || SPOTS.br);
    const sx = spot ? (spot[0] / 100) * W - s / 2 : 0, sy = spot ? (spot[1] / 100) * H - s / 2 : 0;
    const rnd = (a, b) => a + Math.random() * (b - a);
    const turn = r.spin ? rnd(-200, 200) : 0;
    let frames, ms;
    // (straight across: everywhere along an edge, or out of the spot in a cone that way)
    const across = (dx, dy) => {
      let x0, y0;
      if (spot) { x0 = sx; y0 = sy; } else if (dy) { x0 = rnd(0, W - s); y0 = dy > 0 ? -s : H; } else { x0 = dx > 0 ? -s : W; y0 = rnd(0, H - s); }
      const a = Math.atan2(dy, dx) + (spot ? rnd(-0.45, 0.45) : rnd(-0.08, 0.08)), d = Math.hypot(W, H) + s;
      return [{ transform: "translate(" + x0 + "px," + y0 + "px) rotate(0deg)", opacity: 0 }, { opacity: 1, offset: 0.08 }, { transform: "translate(" + (x0 + Math.cos(a) * d) + "px," + (y0 + Math.sin(a) * d) + "px) rotate(" + turn + "deg)", opacity: 0.9 }];
    };
    if (r.dir === "up") { frames = across(0, -1); ms = rnd(4000, 6500); }
    else if (r.dir === "left") { frames = across(-1, 0); ms = rnd(4000, 6500); }
    else if (r.dir === "right") { frames = across(1, 0); ms = rnd(4000, 6500); }
    else if (r.dir === "fountain" || r.dir === "burst") {
      // (thrown out of the spot (the bottom's middle, without one): a fountain arcs up and falls; a burst flies out and fades)
      const x0 = spot ? sx : W / 2 - s / 2, y0 = spot ? sy : (r.dir === "fountain" ? H : H / 2 - s / 2);
      const a = r.dir === "fountain" ? -Math.PI / 2 + rnd(-0.55, 0.55) : rnd(0, Math.PI * 2);
      const v = r.dir === "fountain" ? rnd(0.75, 1.15) * H : rnd(0.25, 0.5) * Math.hypot(W, H), g = r.dir === "fountain" ? 1.9 * H : 0;
      ms = r.dir === "fountain" ? rnd(2600, 3400) : rnd(1400, 2200);
      frames = [];
      for (let k = 0; k <= 12; k++) {
        const t = k / 12, T = (t * ms) / 1000;
        const x = x0 + Math.cos(a) * v * T * (r.dir === "burst" ? (1 - t * 0.35) : 1), y = y0 + Math.sin(a) * v * T + 0.5 * g * T * T;
        frames.push({ transform: "translate(" + x + "px," + y + "px) rotate(" + turn * t + "deg) scale(" + (r.dir === "burst" ? 0.6 + t * 0.6 : 1) + ")", opacity: k === 0 ? 0 : r.dir === "burst" ? 1 - t : k > 10 ? 0.6 : 1 });
      }
    } else if (r.dir === "float") {
      // (bubbles drifting up, swaying)
      const x0 = spot ? sx : rnd(0, W - s), y0 = spot ? sy : H, rise = spot ? rnd(0.5, 0.9) * H : H + s * 2, sway = rnd(30, 70), ph = rnd(0, 6.28);
      ms = rnd(6000, 9000);
      frames = [];
      for (let k = 0; k <= 10; k++) { const t = k / 10; frames.push({ transform: "translate(" + (x0 + Math.sin(ph + t * 6.28) * sway) + "px," + (y0 - rise * t) + "px) rotate(" + Math.sin(t * 6.28) * 15 + "deg)", opacity: k === 0 ? 0 : spot && k > 7 ? 1 - (t - 0.7) / 0.3 : 1 }); }
    } else { frames = across(0, 1); frames[2].transform = frames[2].transform.replace(/translate\(([-\d.]+)px/, (m, x) => "translate(" + (Number(x) + rnd(-40, 40)) + "px"); ms = rnd(4000, 7000); }
    const i = document.createElement("img");
    i.src = u; i.className = "rain";
    i.style.width = s + "px";
    stage.appendChild(i);
    const an = i.animate(frames, { duration: ms * pace, easing: r.dir === "fountain" || r.dir === "float" ? "linear" : r.dir === "burst" ? "cubic-bezier(0.1, 0.7, 0.3, 1)" : "linear", fill: "forwards" });
    an.onfinish = () => i.remove();
  }
  // (what it rains: chat's emotes, your own pictures, or both)
  function rainPool() {
    const r = rainSet(), mine = (r.imgs || []).filter(Boolean);
    const chat = recent.length ? recent : ["https://static-cdn.jtvnw.net/emoticons/v2/25/default/dark/2.0"];
    return r.src === "mine" && mine.length ? mine : r.src === "both" && mine.length ? chat.concat(mine) : chat;
  }
  function emoterain() {
    const b = suite.burst || 0, r = rainSet();
    if (rainBurst >= 0 && b > rainBurst) {
      const pool = rainPool(), n = Math.max(5, Math.min(150, Number(r.amount) || 30));
      for (let k = 0; k < n; k++) setTimeout(() => drop(pool[Math.floor(Math.random() * pool.length)]), k * (r.dir === "burst" ? 15 : 90));
    }
    rainBurst = b;
  }
  if (PATH === "/emotes") { document.body.classList.add("rainy"); setInterval(rainPoll, 1500); rainPoll(); }

  function draw() {
    if (!suite) return;
    document.body.classList.toggle("still", suite.anim === "none");
    ["glass", "neon", "comic", "minimal", "pastel", "y2k", "pixel", "edge", "sticker"].forEach((t) => document.body.classList.toggle("t-" + t, suite.theme === t));
    useFont((suite.fonts || {})[suite.theme || "dark"]);
    // (a palette, or your own colours, over your accent)
    if (suite.colors && suite.colors.c1) { document.body.style.setProperty("--c1", suite.colors.c1); document.body.style.setProperty("--c2", suite.colors.c2); }
    else if (accent) { document.body.style.setProperty("--c1", accent[0]); document.body.style.setProperty("--c2", accent[1]); }
    const gif = gifNow();
    ["top", "left", "right", "corner"].forEach((p) => document.body.classList.toggle("gp-" + p, (suite.gifPlace || "top") === p));
    document.body.style.setProperty("--gif", gif ? 'url("' + String(gif).replace(/["\\]/g, "") + '")' : "none");
    document.body.style.setProperty("--gs", { small: "5rem", medium: "7.5rem", large: "10rem" }[suite.gifSize] || "7.5rem");
    if (PATH === "/goals") { const sh = ["liquid", "jar", "hourglass"].includes(suite.goals.style); fit(sh ? 620 : 460, sh ? 300 : 260); goals(); }
    else if (PATH === "/timer") { fit(360, 140); timer(); }
    else if (PATH === "/latest-follow") { fit(420, 90); latest("follow"); }
    else if (PATH === "/latest-sub") { fit(420, 90); latest("sub"); }
    else if (PATH === "/raid") { fit(560, 420); raid(); }
    else if (PATH === "/hype") { fit(520, suite.hype && suite.hype.train ? 140 : 110); hype(); }
    else if (PATH === "/voteskip") { fit(520, 130); voteskip(); }
    else if (PATH === "/wheel") { fit(520, 560); wheel(); }
    else if (PATH === "/leaderboard") { fit(420, 380); leaderboard(); }
    else if (PATH === "/tune") { fit(520, 180); tune(); }
    else if (PATH === "/emotes") emoterain();
    // (the GIF on the widget shown now)
    const on = [...$("stage").children].filter((e) => !e.classList.contains("out") && !e.classList.contains("rain")).pop();
    if (on) on.classList.toggle("gifme", !!gif);
  }
  addEventListener("resize", draw);

  let sig = "", accent = null;
  async function poll() {
    try {
      const s = await (await fetch("/now.json" + (PREVIEW ? "?preview=1" : ""), { cache: "no-store" })).json();
      // (in your accent colours, as the Stream Widget is)
      if (s.accent) accent = [s.accent, s.accent2 || s.accent];
      if (accent && !(s.suite && s.suite.colors)) { document.body.style.setProperty("--c1", accent[0]); document.body.style.setProperty("--c2", accent[1]); }
      const next = JSON.stringify(s.suite || null);
      if (next !== sig) { sig = next; suite = s.suite || null; draw(); }
    } catch (e) {}
  }
  setInterval(poll, PREVIEW ? 500 : 1500);
  poll();
</script>
