[package]
name = "omnipulse-core"
version = "0.1.0"
edition = "2021"
description = "OmniPulse's backend: accounts, streaming services, local music and the local servers"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"
md5 = "0.7"
tokio = { version = "1", features = ["time", "process", "rt", "sync"] }
lofty = "0.22"
tiny_http = "0.12"
opener = "0.7"
librespot-core = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-playback = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-oauth = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-metadata = { version = "0.8", default-features = false }
futures = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav", "aiff"] }
ebur128 = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
