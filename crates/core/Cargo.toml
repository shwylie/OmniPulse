[package]
name = "omnipulse-core"
version = "0.2.5"
edition = "2021"
description = "OmniPulse's backend: accounts, streaming services, local music and the local servers"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
rand = "0.8"
urlencoding = "2"
md5 = "0.7"
tokio = { version = "1", features = ["time", "process", "rt", "sync"] }
lofty = "0.22"
tiny_http = "0.12"
opener = "0.7"
librespot-core = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-playback = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-oauth = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-metadata = { version = "0.8", default-features = false }
futures = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav", "aiff"] }
ebur128 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
mdns-sd = "0.13"
native-tls = "0.2"
omnipulse-pcmout = { path = "../pcmout" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Diagnostics_ToolHelp"] }
windows-core = "0.62"
