[package]
name = "omnipulse-core"
version = "0.3.10"
edition = "2021"
description = "OmniPulse's backend: accounts, streaming services, local music and the local servers"

# desktop (the default): the Tauri and native apps, with everything. mobile: the Android app (through
# crates/mobile), only accounts, search, likes, playlists, MusicBrainz, Last.fm and lyrics; its TLS
# is rustls, so nothing needs OpenSSL for Android.
[features]
default = ["desktop"]
desktop = ["reqwest/default-tls", "dep:tiny_http", "dep:opener", "dep:librespot-core", "dep:librespot-playback", "dep:librespot-oauth", "dep:librespot-metadata", "dep:librespot-protocol", "dep:protobuf",
  "dep:symphonia", "dep:ebur128", "dep:zip", "dep:mdns-sd", "dep:native-tls", "dep:omnipulse-pcmout", "dep:lofty", "dep:beat-this", "dep:rten"]
mobile = ["reqwest/rustls-tls"]

[dependencies]
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
rand = "0.8"
urlencoding = "2"
md5 = "0.7"
tokio = { version = "1", features = ["time", "process", "rt", "sync"] }
lofty = { version = "0.22", optional = true }
tiny_http = { version = "0.12", optional = true }
opener = { version = "0.7", optional = true }
librespot-core = { version = "0.8", default-features = false, features = ["native-tls"], optional = true }
librespot-playback = { version = "0.8", default-features = false, features = ["native-tls"], optional = true }
librespot-oauth = { version = "0.8", default-features = false, features = ["native-tls"], optional = true }
librespot-metadata = { version = "0.8", default-features = false, optional = true }
# (your playlist list from Spotify's own service: its message read as it comes)
librespot-protocol = { version = "0.8", optional = true }
protobuf = { version = "3.7", optional = true }
futures = "0.3"
unicode-normalization = "0.1"
# BPM, beats and key (rhythm.rs)
realfft = "3.5"
# each bar's first beat (rhythm.rs): Beat This! (ISMIR 2024), its small model (models/), in pure Rust
beat-this = { version = "1.1", default-features = false, optional = true }
# (its thread pool: one thread, in the background, so a game never loses frames to it)
rten = { version = "0.24", optional = true }
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav", "aiff"], optional = true }
ebur128 = { version = "0.1", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
mdns-sd = { version = "0.13", optional = true }
native-tls = { version = "0.2", optional = true }
omnipulse-pcmout = { path = "../pcmout", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Diagnostics_ToolHelp"] }
windows-core = "0.62"
