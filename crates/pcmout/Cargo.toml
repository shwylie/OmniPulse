[package]
name = "omnipulse-pcmout"
version = "0.1.0"
edition = "2021"
description = "Plays PCM sent in pieces on a playback device (OmniPulse's own sound, and OmniPulse Offset)"

[dependencies]
cpal = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio"] }
