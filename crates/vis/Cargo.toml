[package]
name = "omnipulse-vis"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "OmniPulse's GPU visualiser scenes: GLSL passes run on wgpu (and the same scenes on the Stream Widget, in WebGL)"

[dependencies]
wgpu = { version = "30", default-features = false, features = ["glsl", "dx12", "vulkan", "metal", "std", "parking_lot"] }
realfft = "3.5"
pollster = "0.4"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
