<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Panel words</title>
<!--
  A panel's words, written and formatted as in any word processor (Panels' editor, in the app): Ctrl+B bold,
  Ctrl+I italics, Ctrl+U underline, or the buttons; bulleted and numbered lists. What's written goes back to the
  app as it changes (window.ipc), as the panels keep it: **bold**, *italics*, __underline__, a line each, lists'
  lines starting "- " or "1. ". The app gives it the words and its colours first (window.__init).
-->
<style>
  :root { --bg: #14161d; --panel: #1c1f29; --line: #2c3040; --text: #e8e6f0; --muted: #a9a5ba; --accent: #8e9bff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
  #bar button { width: 34px; height: 30px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--text); cursor: pointer; display: grid; place-items: center; }
  #bar button:hover { background: var(--bg); border-color: var(--line); }
  #bar button.on { background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: var(--accent); }
  #bar svg { width: 18px; height: 18px; fill: currentColor; }
  #bar .sep { width: 1px; background: var(--line); margin: 3px 4px; }
  #words { flex: 1; overflow-y: auto; padding: 12px 14px; outline: none; white-space: pre-wrap; word-wrap: break-word; }
  #words:empty::before { content: attr(data-hint); color: var(--muted); }
  #words ul, #words ol { margin: 4px 0; padding-left: 26px; }
  #words div { min-height: 1.5em; }
  ::selection { background: color-mix(in srgb, var(--accent) 45%, transparent); }
</style>
</head>
<body>
<div id="bar">
  <button data-cmd="bold" title="Bold (Ctrl+B)"><svg viewBox="0 0 24 24"><path d="M15.6 10.79c.97-.67 1.65-1.77 1.65-2.79 0-2.26-1.75-4-4-4H7v14h7.04c2.09 0 3.71-1.7 3.71-3.79 0-1.52-.86-2.82-2.15-3.42zM10 6.5h3c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-3v-3zm3.5 9H10v-3h3.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5z"/></svg></button>
  <button data-cmd="italic" title="Italics (Ctrl+I)"><svg viewBox="0 0 24 24"><path d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4z"/></svg></button>
  <button data-cmd="underline" title="Underline (Ctrl+U)"><svg viewBox="0 0 24 24"><path d="M12 17c3.31 0 6-2.69 6-6V3h-2.5v8c0 1.93-1.57 3.5-3.5 3.5S8.5 12.93 8.5 11V3H6v8c0 3.31 2.69 6 6 6zm-7 2v2h14v-2H5z"/></svg></button>
  <span class="sep"></span>
  <button data-cmd="insertUnorderedList" title="A bulleted list"><svg viewBox="0 0 24 24"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg></button>
  <button data-cmd="insertOrderedList" title="A numbered list"><svg viewBox="0 0 24 24"><path d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/></svg></button>
</div>
<div id="words" contenteditable="true" spellcheck="true" data-hint="Words under the title, if you like."></div>
<script>
  const box = document.getElementById("words");
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // (a line's words as the panels keep them, as HTML: **bold**, *italics*, __underline__, each on till its mark again)
  function inline(s) {
    let out = "", b = false, i = false, u = false;
    for (let k = 0; k < s.length;) {
      if (s.startsWith("**", k)) { out += b ? "</b>" : "<b>"; b = !b; k += 2; }
      else if (s.startsWith("__", k)) { out += u ? "</u>" : "<u>"; u = !u; k += 2; }
      else if (s[k] === "*") { out += i ? "</i>" : "<i>"; i = !i; k += 1; }
      else { out += esc(s[k]); k += 1; }
    }
    if (u) out += "</u>"; if (i) out += "</i>"; if (b) out += "</b>";
    return out;
  }
  // The words as kept, shown: a line each; lines of a list together as one
  function toHtml(md) {
    let html = "", list = "";
    const close = () => { if (list) { html += "</" + list + ">"; list = ""; } };
    for (const raw of String(md || "").replace(/\r/g, "").split("\n")) {
      let m, kind = "", text = raw;
      if ((m = /^\s*[-•*]\s+(.*)$/.exec(raw))) { kind = "ul"; text = m[1]; }
      else if ((m = /^\s*\d{1,3}[.)]\s+(.*)$/.exec(raw))) { kind = "ol"; text = m[1]; }
      if (kind) { if (list !== kind) { close(); html += "<" + kind + ">"; list = kind; } html += "<li>" + (inline(text) || "<br>") + "</li>"; }
      else { close(); html += "<div>" + (inline(text) || "<br>") + "</div>"; }
    }
    close();
    return html;
  }
  // What's written, as kept: each block a line; a list's items "- " or "1. "; bold, italics, underline marked
  function toMd() {
    const lines = [];
    let cur = "";
    const flush = () => { lines.push(cur); cur = ""; };
    const walk = (n, st) => {
      if (n.nodeType === 3) { cur += n.nodeValue.replace(/ /g, " ").replace(/\n/g, " "); return; }
      if (n.nodeType !== 1) return;
      const tag = n.tagName, css = n.style || {};
      // (a break: a new line; one ending its line (as an empty line's is) isn't another)
      // (inside bold or the like there too, as an empty line made bold is: <div><b><br></b></div>)
      if (tag === "BR") {
        let x = n;
        while (x.parentNode && x.parentNode !== box && !x.nextSibling && !["DIV", "P", "LI"].includes(x.parentNode.tagName)) x = x.parentNode;
        if (x.nextSibling || !x.parentNode || !["DIV", "P", "LI"].includes(x.parentNode.tagName)) flush();
        return;
      }
      if (tag === "UL" || tag === "OL") {
        if (cur) flush();
        let k = 0;
        for (const li of n.children) { if (li.tagName !== "LI") continue; k += 1; cur = tag === "UL" ? "- " : k + ". "; for (const c of li.childNodes) walk(c, st); flush(); }
        return;
      }
      const block = tag === "DIV" || tag === "P";
      if (block && cur) flush();
      const b = !st.b && (tag === "B" || tag === "STRONG" || Number(css.fontWeight) >= 600 || css.fontWeight === "bold");
      const i = !st.i && (tag === "I" || tag === "EM" || css.fontStyle === "italic");
      const u = !st.u && (tag === "U" || String(css.textDecoration || "").includes("underline"));
      const open = (b ? "**" : "") + (i ? "*" : "") + (u ? "__" : ""), shut = (u ? "__" : "") + (i ? "*" : "") + (b ? "**" : "");
      const before = cur.length;
      for (const c of n.childNodes) walk(c, { b: st.b || b, i: st.i || i, u: st.u || u });
      // (its marks round its words, the spaces either side outside them: "** word**" wouldn't read back as bold)
      if (open) {
        const inner = cur.slice(before), words = inner.trim();
        cur = cur.slice(0, before) + (words ? inner.match(/^\s*/)[0] + open + words + shut + inner.match(/\s*$/)[0] : inner);
      }
      if (block) flush();
    };
    for (const c of box.childNodes) walk(c, {});
    if (cur) flush();
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    return lines.map((l) => l.replace(/\s+$/, "")).join("\n");
  }
  let last = null;
  function send() {
    const md = toMd();
    if (md !== last) { last = md; window.ipc.postMessage(md); }
    for (const b of document.querySelectorAll("#bar button")) { try { b.classList.toggle("on", document.queryCommandState(b.dataset.cmd)); } catch (e) {} }
  }
  for (const b of document.querySelectorAll("#bar button")) {
    b.addEventListener("mousedown", (e) => e.preventDefault());
    b.addEventListener("click", () => { box.focus(); document.execCommand(b.dataset.cmd); send(); });
  }
  box.addEventListener("input", send);
  document.addEventListener("selectionchange", send);
  // (pasted as plain words: another page's styles and colours left behind)
  box.addEventListener("paste", (e) => { e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain")); });
  // (the app's words and colours, given before the page loads)
  const init = window.__init || {};
  if (init.colours) for (const [k, v] of Object.entries(init.colours)) document.documentElement.style.setProperty("--" + k, v);
  document.execCommand("defaultParagraphSeparator", false, "div");
  box.innerHTML = toHtml(init.words || "");
  last = toMd();
  box.focus();
  const r = document.createRange(); r.selectNodeContents(box); r.collapse(false);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
</script>
</body>
</html>
