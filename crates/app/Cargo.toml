[package]
name = "omnipulse"
version = "0.3.11"
edition = "2021"
description = "OmniPulse, native: one window, one process (Slint), beside the web app until it does everything"

[[bin]]
name = "OmniPulse-native"
path = "src/main.rs"

[dependencies]
unicode-normalization = "0.1"
omnipulse-core = { path = "../core" }
omnipulse-audio = { path = "../audio" }
slint = { version = "1.18", features = ["unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
serde_json = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
reqwest = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# the media keys and the tray (the same versions the web app uses, through Tauri)
global-hotkey = "0.8"
tray-icon = "0.25"
# Back Up & Restore's file dialogs (the version Tauri's dialog plugin uses)
rfd = "0.16"
# copying share links (the version Tauri's clipboard plugin uses)
arboard = "3.6"
# the updater: releases are checked against OmniPulse's own key before installing (as Tauri's updater does)
minisign-verify = "0.2"
base64 = "0.22"
# Listen Along and Jams: the relay's rooms (the version the workspace has already)
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = "0.3"
rquickjs = "0.9"

# Apple Music's sign-in, once, for its import (the web view Tauri uses: Windows' own WebView2)
wry = "0.57"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_WinRT", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Controls_Dialogs", "Foundation", "Media", "Storage_Streams"] }

[build-dependencies]
slint-build = "1.18"
embed-resource = "3.0.12"
