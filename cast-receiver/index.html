<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniPulse</title>
<!--
  OmniPulse's display for Cast devices with a screen (a Nest Hub, a TV): what's playing, in the style
  of the OBS widget, with play/pause and skip buttons on touch screens. There's no browsing here; the
  app on the PC is the player, and this plays its live stream. See README.md for setting it up.
-->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  @property --bg1 { syntax: "<color>"; inherits: true; initial-value: #14161d; }
  @property --bg2 { syntax: "<color>"; inherits: true; initial-value: #1d2030; }
  :root { transition: --bg1 1.2s ease, --bg2 1.2s ease; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0c10; color: #fff; }
  body { font-family: "Google Sans", Roboto, system-ui, sans-serif; }
  #stage {
    position: absolute; inset: 0; display: flex; align-items: center; gap: 6vh; padding: 9vh 8vw; box-sizing: border-box;
    background: linear-gradient(120deg, var(--bg1), var(--bg2));
  }
  #blur { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(60px) brightness(0.45); opacity: 0.55; transition: opacity 0.6s; }
  #art {
    position: relative; height: 70vh; aspect-ratio: 1; flex: none; border-radius: 3vh; object-fit: cover;
    background: rgba(255, 255, 255, 0.1); box-shadow: 0 3vh 8vh rgba(0, 0, 0, 0.5); transition: opacity 0.4s;
  }
  #info { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; transition: opacity 0.4s; }
  .fade { opacity: 0 !important; }
  #title { font-size: 7vh; font-weight: 700; line-height: 1.12; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #artist { margin-top: 1.6vh; font-size: 4vh; color: rgba(255, 255, 255, 0.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #album { margin-top: 0.8vh; font-size: 3vh; color: rgba(255, 255, 255, 0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #track { height: 0.9vh; margin-top: 5vh; border-radius: 1vh; background: rgba(255, 255, 255, 0.22); overflow: hidden; }
  #bar { height: 100%; width: 0; background: rgba(255, 255, 255, 0.92); }
  #times { display: flex; justify-content: space-between; margin-top: 1.2vh; font-size: 2.6vh; color: rgba(255, 255, 255, 0.7); font-variant-numeric: tabular-nums; }
  #controls { display: flex; align-items: center; gap: 4vh; margin-top: 4vh; }
  #controls button {
    width: 12vh; height: 12vh; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%;
    background: rgba(255, 255, 255, 0.12); color: #fff; cursor: pointer;
  }
  #controls button:active { transform: scale(0.94); }
  #controls #toggle { width: 15vh; height: 15vh; background: #fff; color: #111; }
  #controls svg { width: 50%; height: 50%; fill: currentColor; }
  #idle { position: absolute; inset: 0; display: grid; place-items: center; font-size: 4vh; color: rgba(255, 255, 255, 0.6); }
  body.playing #idle, body.has #idle { display: none; }
  body:not(.has) #stage { visibility: hidden; }
  audio { display: none; }
</style>
</head>
<body>
<div id="idle">OmniPulse</div>
<div id="stage">
  <div id="blur"></div>
  <img id="art" alt="">
  <div id="info">
    <div id="title"></div>
    <div id="artist"></div>
    <div id="album"></div>
    <div id="track"><div id="bar"></div></div>
    <div id="times"><span id="pos">0:00</span><span id="dur"></span></div>
    <div id="controls">
      <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button id="toggle" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path id="toggleIcon" d="M8 5v14l11-7z"/></svg></button>
      <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg></button>
    </div>
  </div>
</div>
<audio id="player"></audio>
<script>
const NS = "urn:x-cast:com.omnipulse.app";
const PLAY = "M8 5v14l11-7z", PAUSE = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";
const $ = (id) => document.getElementById(id);
const ctx = cast.framework.CastReceiverContext.getInstance();
const player = ctx.getPlayerManager();
player.setMediaElement($("player"));

let state = { playing: false, position_ms: 0, duration_ms: 0, updated_at: Date.now() };
let shown = "";

const fmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

function paintTrack(t) {
  if (!t) return;
  const key = (t.title || "") + "|" + (t.artist || "");
  document.body.classList.add("has");
  const apply = () => {
    $("title").textContent = t.title || "";
    $("artist").textContent = t.artist || "";
    $("album").textContent = t.album || "";
    const art = t.artwork || t.art || "";
    if (art) { $("art").src = art; $("blur").style.backgroundImage = "url(\"" + art.replace(/"/g, "") + "\")"; }
    else { $("art").removeAttribute("src"); $("blur").style.backgroundImage = ""; }
    if (t.accent) document.documentElement.style.setProperty("--bg1", t.accent);
    if (t.accent2) document.documentElement.style.setProperty("--bg2", t.accent2);
    $("info").classList.remove("fade");
    $("art").classList.remove("fade");
  };
  if (key === shown) { apply(); return; }
  shown = key;
  $("info").classList.add("fade");
  $("art").classList.add("fade");
  setTimeout(apply, 350);
}

function paintState(s) {
  if (!s) return;
  state = Object.assign({}, s, { at: Date.now() });
  if (s.title) paintTrack(s);
  document.body.classList.toggle("playing", !!s.playing);
  $("toggleIcon").setAttribute("d", s.playing ? PAUSE : PLAY);
}

// the position moves on between updates while playing
setInterval(() => {
  const pos = state.position_ms + (state.playing ? Date.now() - (state.at || Date.now()) : 0);
  const dur = state.duration_ms || 0;
  $("bar").style.width = dur ? Math.min(100, (pos / dur) * 100) + "%" : "0";
  $("pos").textContent = fmt(Math.min(pos, dur || pos));
  $("dur").textContent = dur ? fmt(dur) : "";
}, 250);

const send = (msg) => { try { ctx.sendCustomMessage(NS, undefined, msg); } catch (e) {} };
$("toggle").addEventListener("click", () => send({ type: "command", action: "toggle" }));
$("prev").addEventListener("click", () => send({ type: "command", action: "prev" }));
$("next").addEventListener("click", () => send({ type: "command", action: "next" }));

ctx.addCustomMessageListener(NS, (ev) => {
  const m = ev.data || {};
  if (m.type === "track") paintTrack(m.track);
  else if (m.type === "state") paintState(m.state);
});
// the first title comes with the stream
player.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (req) => {
  const md = req.media && req.media.metadata;
  if (md) paintTrack({ title: md.title, artist: md.artist, album: md.albumName, artwork: md.images && md.images[0] && md.images[0].url });
  return req;
});
// the device's own pause/play (a remote, a voice command) goes to the app; the stream keeps going
player.setMessageInterceptor(cast.framework.messages.MessageType.PAUSE, () => { send({ type: "command", action: "toggle" }); return null; });
player.setMessageInterceptor(cast.framework.messages.MessageType.PLAY, () => { send({ type: "command", action: "toggle" }); return null; });
ctx.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, () => setTimeout(() => send({ type: "hello" }), 300));

const options = new cast.framework.CastReceiverOptions();
options.disableIdleTimeout = true;
options.touchScreenOptimizedApp = true;
options.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
options.supportedCommands = cast.framework.messages.Command.PAUSE;
ctx.start(options);
</script>
</body>
</html>
