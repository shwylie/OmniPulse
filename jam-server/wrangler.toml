# OmniPulse's relay for Listen Along and Jams. Deploy with:  npx wrangler deploy   (see README.md)
name = "omnipulse-jam"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# where the join page's "Download OmniPulse" button points (change it any time, here or in the dashboard)
DOWNLOAD_URL = ""
APP_SCHEME = "omnipulse"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "SHARES"
class_name = "Share"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# shared playlists (added later: deploying again adds them)
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Share"]
