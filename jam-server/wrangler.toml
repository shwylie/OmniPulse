# OmniPulse's relay for Listen Along and Jams. Deploy with:  npx wrangler deploy   (see README.md)
name = "omnipulse-jam"
main = "src/index.js"
compatibility_date = "2025-09-01"
# (a deploy leaves variables set in the dashboard alone: a secret added there as Text isn't wiped)
keep_vars = true

[vars]
# where the join page's "Download OmniPulse" button points (change it any time, here or in the dashboard)
DOWNLOAD_URL = ""
APP_SCHEME = "omnipulse"
# OmniPulse's own Kick app (its Client ID; its secret is set with: npx wrangler secret put KICK_CLIENT_SECRET)
KICK_CLIENT_ID = "01M5NZG55J6HQ93XPKVQ8CHRY8"
# OmniPulse's own Twitch app (Confidential; its secret, TWITCH_CLIENT_SECRET, set in the dashboard)
TWITCH_CLIENT_ID = "122hyd1hxg8qpi1nfzwc4oa85lolgd"
# OmniPulse's own SoundCloud app (public: it's in every sign-in link). Its secret: npx wrangler secret put SC_CLIENT_SECRET
SC_CLIENT_ID = "SET_IN_CLOUDFLARE"
SC_REDIRECT = "http://localhost:8080/callback"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# the native app's updates (scripts/release-native.mjs puts them there)
[[r2_buckets]]
binding = "UPDATES"
bucket_name = "omnipulse-updates"

[[durable_objects.bindings]]
name = "SHARES"
class_name = "Share"

[[durable_objects.bindings]]
name = "RATINGS"
class_name = "Ratings"

[[durable_objects.bindings]]
name = "REPORTS"
class_name = "Reports"

[[durable_objects.bindings]]
name = "HOOKS"
class_name = "Hooks"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# shared playlists (added later: deploying again adds them)
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Share"]

# testers' Seamless Mix ratings (read them with RATINGS_KEY: npx wrangler secret put RATINGS_KEY)
[[migrations]]
tag = "v3"
new_sqlite_classes = ["Ratings"]

# bug reports and feature requests from the app (read them with REPORTS_KEY: scripts/reports.mjs; posted to
# Discord too if REPORTS_WEBHOOK is set, both secrets set in the dashboard)
[[migrations]]
tag = "v4"
new_sqlite_classes = ["Reports"]

# webhooks for the app (Ko-fi's tips): /api/hook/kofi/<id>, and its socket /api/hook/kofi/<id>/ws
[[migrations]]
tag = "v5"
new_sqlite_classes = ["Hooks"]
